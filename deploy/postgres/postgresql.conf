# =============================================================================
# Sharpline — PostgreSQL 17 + TimescaleDB server configuration.
#
# Mounted read-only at /etc/postgresql/postgresql.conf and selected explicitly:
#
#   postgres -c config_file=/etc/postgresql/postgresql.conf
#
# THIS FILE IS AUTHORITATIVE. Because config_file points outside PGDATA, the
# postgresql.conf that initdb writes into /var/lib/postgresql/data is never
# read, and neither is anything timescaledb-tune appends to it — which is why
# compose sets NO_TS_TUNE=true rather than letting the tuner scribble into a
# file nobody loads. Every setting the server runs with is in this file.
#
# hba_file and ident_file are deliberately NOT set. With no -D on the command
# line, PostgreSQL derives their defaults from $PGDATA (SelectConfigFiles in
# guc.c), so they resolve to the pg_hba.conf / pg_ident.conf that initdb wrote,
# which is where the entrypoint's POSTGRES_HOST_AUTH_METHOD lands. Setting them
# here would point them at /etc/postgresql/, where those files do not exist,
# and the server would refuse to start.
#
# Sizing target: the `postgres` service in deploy/compose/compose.yaml, capped
# at 2 CPUs / 2 GiB. Values below are derived from that budget, not copied from
# a generic tuning guide — see the arithmetic in each section.
#
# CLAUDE.md §3  Postgres 17 + TimescaleDB, hypertables for the price series
# CLAUDE.md §9  "Named volume, tuned via mounted conf"
# CLAUDE.md §9  structured JSON logging with trace correlation
# =============================================================================


# -----------------------------------------------------------------------------
# Connections
# -----------------------------------------------------------------------------

# The container network is the only client. 'localhost' would break both the
# healthcheck (pg_isready -h 127.0.0.1) and every service on the bridge.
listen_addresses = '*'
port = 5432

# Six Go binaries, each with a small pgx pool, plus the tools container (psql,
# goose) and migrate. 100 is comfortably above that and is the number the
# work_mem budget below is computed against. Raising it means re-doing that
# arithmetic, not just editing this line.
max_connections = 100

# Slots held back so a DBA can still get in when the pool has saturated.
superuser_reserved_connections = 3

# TCP keepalives matter here: connections cross a Docker bridge, and a silently
# dropped NAT mapping otherwise leaves the backend waiting forever on a socket
# whose peer is gone. Detect a dead peer in ~2 minutes.
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# scram-sha-256 is the PG14+ default and what the entrypoint writes into
# pg_hba.conf. Pinned rather than assumed, because a downgrade to md5 would be
# invisible.
password_encryption = scram-sha-256


# -----------------------------------------------------------------------------
# Extensions — shared_preload_libraries
# -----------------------------------------------------------------------------
#
# LOAD-BEARING. timescaledb refuses to be created without being preloaded, and
# CLAUDE.md §3/§4 make the `prices` hypertable the core dataset. Because this
# file replaces the PGDATA conf, the preload line timescaledb-tune would
# normally have written does not exist and must be stated here.
#
# pg_stat_statements is preloaded too: CLAUDE.md §9 makes odds staleness the
# headline SLO, and diagnosing a staleness regression means knowing which query
# got slow. It costs a fixed ~1MB of shared memory and no per-query allocation.
shared_preload_libraries = 'timescaledb,pg_stat_statements'

# Self-hosted means self-hosted (CLAUDE.md §0). No phone-home. compose also
# sets TIMESCALEDB_TELEMETRY=off, which additionally unschedules the telemetry
# background job at init time; this line covers the running server.
timescaledb.telemetry_level = 'off'

# TimescaleDB background workers: one per database for the job scheduler, plus
# workers for compression/retention policies. 8 is the upstream default and is
# ample for a single-database deployment; it is stated explicitly because
# max_worker_processes below is sized around it.
timescaledb.max_background_workers = 8

pg_stat_statements.max = 5000
# 'top' records the statement the client actually sent, not statements nested
# inside PL/pgSQL. Cheaper, and it is the granularity the API pool cares about.
pg_stat_statements.track = top
pg_stat_statements.track_utility = off


# -----------------------------------------------------------------------------
# Memory
# -----------------------------------------------------------------------------
#
# Budget against the 2 GiB container limit:
#     shared_buffers                       512 MB
#   + maintenance_work_mem x 2 autovac      256 MB
#   + worst-case work_mem (100 x 8 MB)      800 MB
#                                        ---------
#                                          ~1.6 GB, leaving headroom for
#                                          backend private memory and the OS.
#
# Exceeding the cgroup limit gets the postmaster OOM-killed, which in a stack
# where every other service depends_on postgres being healthy is a total
# outage. The headroom is the point.

# 25% of the container limit — the conventional starting point, and correct
# here because the working set (recent prices, market state) is small and hot.
shared_buffers = 512MB

# Planner hint only; allocates nothing. 75% of the limit, on the assumption
# that shared_buffers plus the VM's page cache hold roughly that much.
effective_cache_size = 1536MB

# Per sort/hash node, not per connection — a single query with several sorts
# can use a multiple of this. 8MB is deliberately modest for that reason; the
# line-history rollups that would want more should get it per-session with
# `SET LOCAL work_mem`, not by raising the global ceiling.
work_mem = 8MB

# VACUUM, CREATE INDEX and ALTER TABLE. Larger than work_mem because it is used
# by few backends at once, and index builds on the price hypertable's chunks
# are the main consumer.
maintenance_work_mem = 128MB

# Autovacuum workers each take maintenance_work_mem; capped lower so four
# concurrent workers cannot claim 512MB.
autovacuum_work_mem = 64MB

# Temporary tables per session. Timescale's chunk-wise plans do not lean on
# these, so the default 8MB is doubled and no more.
temp_buffers = 16MB

# There is deliberately NO per-session memory ceiling here. Neither community
# PostgreSQL 17 nor this Timescale build recognises `max_total_memory` — a
# server started with it in this file exits with
#   FATAL: unrecognized configuration parameter "max_total_memory"
# (observed, not assumed). Containment comes from the cgroup limit in compose
# plus the conservative work_mem above.


# -----------------------------------------------------------------------------
# Parallelism and background workers
# -----------------------------------------------------------------------------
#
# Invariant that must hold or the server logs "too many background workers":
#     max_worker_processes >= timescaledb.max_background_workers
#                             + max_parallel_workers + 1
#     24                   >= 8 + 8 + 1 = 17            ✓

max_worker_processes = 24
max_parallel_workers = 8

# 2 CPUs. Two workers per gather is the whole budget; more would just have them
# fight each other for the same two cores.
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2


# -----------------------------------------------------------------------------
# WAL, checkpoints, durability
# -----------------------------------------------------------------------------

# 'replica' (the default) is enough for crash recovery, streaming replicas and
# pg_basebackup. 'logical' is not enabled: nothing here does CDC yet, and it
# costs extra WAL volume on every UPDATE.
wal_level = replica

# synchronous_commit stays ON. This is a deliberate refusal of the usual
# "it's only local, turn it off" tuning: CLAUDE.md §4 makes the double-entry
# ledger the source of truth, and a config file whose shape is inherited by the
# Helm values in phase 10 must not normalise losing committed transactions.
synchronous_commit = on

# The price stream is insert-heavy, so let WAL accumulate between checkpoints
# rather than checkpointing every few seconds. max_wal_size is the trigger, not
# a reservation — disk is consumed only as WAL is actually written.
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_timeout = 15min
# Spread checkpoint I/O across 90% of the interval so a checkpoint does not
# show up as a latency spike in the odds-staleness SLO.
checkpoint_completion_target = 0.9

# pglz, not lz4/zstd: available in every build, so this file does not silently
# fail to start on a PostgreSQL compiled without the newer codecs. Full-page
# images dominate WAL right after a checkpoint and compress well.
wal_compression = on

wal_buffers = 16MB

# Write-heavy ingest benefits from a larger writer batch.
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB


# -----------------------------------------------------------------------------
# Planner / storage assumptions
# -----------------------------------------------------------------------------

# The data lives on the Docker Desktop VM's virtual disk, backed by NVMe. Random
# reads cost near-sequential, so the on-spinning-rust default of 4.0 badly
# overprices index scans — which is exactly the access pattern of a hypertable
# query filtered by market_id and time.
random_page_cost = 1.1

# Concurrent I/O requests the storage can service. 200 is the standard SSD
# value; on rotational storage this should drop to 2.
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# JIT is off. Its compile cost is paid per query and only repays on long
# analytical scans; the serving path here is many small, fast, repeated
# queries, where JIT is pure added latency. Turn it back on for the phase 9
# analytics workload if measurement justifies it.
jit = off

# Timescale chunk exclusion depends on good statistics on the time column.
default_statistics_target = 100


# -----------------------------------------------------------------------------
# Autovacuum
# -----------------------------------------------------------------------------
#
# Prices are append-only and immutable (CLAUDE.md §4: "a new price is a new
# row"), so vacuum's job here is mostly freezing and visibility-map maintenance
# for index-only scans — worth doing promptly and cheaply.

autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
# The default cost limit throttles autovacuum to roughly a floppy disk's worth
# of throughput. On SSD that just makes vacuum fall behind a fast ingest rate.
autovacuum_vacuum_cost_limit = 1000
autovacuum_vacuum_cost_delay = 2ms


# -----------------------------------------------------------------------------
# Statement and transaction limits
# -----------------------------------------------------------------------------

# No global statement_timeout: migrations and index builds run through this
# same server and are legitimately long. Serving-path timeouts belong on the
# client side, where CLAUDE.md §12 already requires "every external call has a
# timeout" via context.Context.
statement_timeout = 0

# A backend left idle inside a transaction pins the xmin horizon and blocks
# vacuum from reclaiming anything — the classic cause of runaway bloat when a
# Go service leaks a *sql.Tx. Kill it after a minute and let the pool reconnect.
idle_in_transaction_session_timeout = 60s

# Fail fast rather than queue behind a lock during a migration.
lock_timeout = 30s
deadlock_timeout = 1s


# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
#
# logging_collector stays OFF so the postmaster writes to stderr, Docker's
# json-file driver captures it, and `docker compose logs` / Loki / the k8s log
# pipeline all see it — the same path the Go services' slog output takes. A
# collector would bury the logs in a file inside the container that nothing in
# this stack is wired to read.
#
# WHY NOT log_destination = 'jsonlog', given that internal/platform/logging
# emits slog JSON: because PostgreSQL cannot do both. jsonlog is produced by
# the syslogger, so it requires logging_collector = on, and the collector by
# definition captures stderr into a file instead of letting it reach the
# container's stdout. Setting jsonlog with the collector off is worse than
# useless — the postmaster prints
#     LOG:  ending log output to stderr
#     HINT: Future log output will go to log destination "jsonlog".
# and then goes right on writing plain stderr text. That was tried against
# this exact image (PostgreSQL 17.10, timescale/timescaledb:latest-pg17) and
# every subsequent line was still stderr-formatted. Structured JSON in the
# database log is therefore not available without giving up container-native
# logging, and container-native logging wins.
#
# Correlation is preserved a different way: the prefix below is logfmt, which
# is mechanically parseable, and `app=%a` carries application_name — which the
# Go pools set to the service name, making it the join key between a slow-query
# line here and the api/ingest/settle slog line that caused it. Timestamps are
# UTC millisecond-resolution on both sides.
logging_collector = off
log_destination = 'stderr'
log_line_prefix = 'ts=%m pid=%p %qsession=%c vxid=%v user=%u db=%d app=%a '

# Everything below WARNING is noise in a container; client_min_messages stays
# at the default so psql sessions still see NOTICEs.
log_min_messages = warning
log_min_error_statement = error

# Anything slower than 250ms on the serving path is a staleness risk. Low
# enough to catch real regressions, high enough not to log every insert.
log_min_duration_statement = 250ms

# Checkpoint timing is the first thing to check when p99 write latency moves.
log_checkpoints = on
# Connection churn is a real defect signal: the Go pools are meant to be
# long-lived, so a stream of connect/disconnect lines means a pool is being
# rebuilt per request.
log_connections = on
log_disconnections = on
# A lock wait longer than deadlock_timeout is always worth seeing.
log_lock_waits = on
# 0 = log every temp file. A temp file at all means work_mem was too small for
# that query; that is information, not noise, at this scale.
log_temp_files = 0
log_autovacuum_min_duration = 250ms
log_error_verbosity = default
log_statement = 'ddl'

# UTC everywhere. Prices are a time series joined across a provider feed, Kafka
# event time and wager placement time; a server-local timezone anywhere in that
# chain is a correctness bug waiting to happen (CLAUDE.md §3, Flink event-time
# joins in phase 12 depend on this).
log_timezone = 'UTC'
timezone = 'UTC'


# -----------------------------------------------------------------------------
# Statistics
# -----------------------------------------------------------------------------

# Required for pg_stat_statements' blk_read_time / blk_write_time columns and
# for EXPLAIN (ANALYZE, BUFFERS) to report I/O time. Measurable overhead on
# platforms with a slow clock source; negligible on Linux with a vDSO clock,
# which is what the container runs on.
track_io_timing = on
track_functions = pl
track_activity_query_size = 4096


# -----------------------------------------------------------------------------
# Locale and defaults
# -----------------------------------------------------------------------------

datestyle = 'iso, mdy'
intervalstyle = 'postgres'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Money is stored as integer minor units (CLAUDE.md §12), never as `money` or
# float, so no locale-dependent currency formatting is involved anywhere.
