# =============================================================================
# Sharpline REST API -- OpenAPI 3.0.3
# =============================================================================
#
# THIS FILE IS THE CONTRACT. It is authored by hand and the Go wire types are
# generated FROM it (`make codegen-openapi` -> internal/httpapi/gen). Spec-first,
# not code-first, and the choice is enforced rather than asserted:
#
#   1. Every response body this service writes is a struct in
#      internal/httpapi/gen. A handler that wants to add, rename or retype a
#      field cannot do it in Go -- the generated struct has no such field and the
#      package does not compile. The only way to change the wire is to change
#      this file.
#   2. `make codegen-check-openapi` regenerates into a throwaway path and fails
#      on any diff against the committed output, so the committed Go cannot
#      silently stop matching this YAML.
#   3. internal/httpapi/routes_test.go asserts that the route table the router
#      actually mounts is exactly the set of (path, method) pairs declared here.
#      A handler mounted at an undeclared path fails the test; a path declared
#      here with no handler fails it too.
#
# (1) and (2) pin the SHAPES, (3) pins the SURFACE. A spec that drifts from the
# implementation is worse than no spec, because clients trust it.
#
# WHY ONLY MODELS ARE GENERATED, NOT THE SERVER
# ---------------------------------------------
# oapi-codegen can emit a server interface and a chi/echo/gin router. It is
# configured (internal/httpapi/oapi-codegen.yaml) to emit models only, for one
# reason: every server mode drags in a runtime dependency
# (github.com/oapi-codegen/runtime, plus a third-party router) and Go 1.22's
# net/http ServeMux already does method+wildcard routing. The generated types are
# where the contract actually bites; the router is twenty lines of net/http.
#
# -----------------------------------------------------------------------------
# CONVENTIONS THAT APPLY TO EVERY OPERATION BELOW
# -----------------------------------------------------------------------------
#
# MONEY IS AN INTEGER NUMBER OF MINOR UNITS, NEVER A FLOAT, NEVER A STRING.
#   Every money field is named `*_minor` so the unit is in the name and cannot be
#   misread as major units, is `type: integer, format: int64`, and is bounded to
#   +/-9007199254740991.
#
#   That bound is 2^53-1. It is simultaneously domain.MaxSafeMoney, the CHECK
#   constraint on every money column in migrations 00005 and 00006, and
#   JavaScript's Number.MAX_SAFE_INTEGER -- so a JSON number is a LOSSLESS
#   representation for every value that can exist, and the frontend needs no
#   BigInt and no string parsing. A string ("1234") would be defensible if the
#   range were unbounded; it is not, and a string invites a client to run
#   parseFloat over it, which is the exact defect the integer bound exists to
#   prevent. CLAUDE.md section 12: "All money and stake values are integer minor
#   units. Floating point never touches a balance."
#
# ODDS ARE DECIMAL FLOATS, AND DECIMAL IS CANONICAL.
#   Phase 1 established that Decimal is the canonical representation and that
#   American and Fractional are LOSSY DISPLAY formats (odds.RenderAmerican and
#   odds.RenderFractional round; the round trip back is not the identity). So the
#   canonical value always travels: every price object carries `decimal_odds`
#   unconditionally.
#
#   `odds_format` (query parameter, default `decimal`) does not replace it. When
#   it names american or fractional the price object gains an ADDITIONAL
#   `display` string rendered server-side by internal/domain/odds. Rationale: the
#   browser toggles format on data it already holds and must never refetch a live
#   board to change a display format, so the client converts -- but pkg/client
#   consumers and curl users get the rendering for free without reimplementing
#   odds.RenderFractional's continued-fraction search. Both audiences are served
#   and neither can lose the canonical value.
#
# PAGINATION IS KEYSET (CURSOR), NEVER OFFSET.
#   `ingest` writes the events and prices tables continuously. OFFSET re-evaluates
#   the whole ordered set on every page, so a row inserted ahead of the offset
#   between page N and page N+1 pushes one row across the boundary and the reader
#   NEVER SEES IT; a row that leaves the set duplicates one. On a board that
#   changes every few seconds that is not a rare race, it is the normal case.
#
#   A keyset cursor names the last row instead of counting rows, so insertions
#   and deletions elsewhere in the set cannot shift it. Cursors are OPAQUE
#   base64url strings: the encoding is an implementation detail and clients that
#   parse one will break when it changes. Every cursor is bound to the exact
#   ordering it was minted under, and a cursor presented against a different
#   ordering or a different filter is rejected 400 rather than silently
#   producing a wrong page.
#
#   Three list endpoints have an unbounded row count and are cursored: the two
#   boards and search. The remaining lists (sports, leagues in a sport, books,
#   the market tree of one event) are bounded by the CATALOGUE, not by time or
#   traffic -- single-digit sports, tens of leagues, tens of books, tens of
#   markets on an event -- and return a single page with `next_cursor: null`.
#   They keep the same envelope so a client has one shape to handle.
#
# ERRORS HAVE ONE SHAPE, AND IT NEVER CARRIES INTERNAL DETAIL.
#   See the Error schema. `message` is written for a human and is chosen from a
#   fixed set of strings in Go; it is never an error value, never a driver
#   message, never a SQLSTATE, never a file path, and never a query. Anything a
#   caller must not see is logged with the request id and dropped from the
#   response, so an operator joins the two by `request_id`.
#
# THIS IS NOT A LICENSED SPORTSBOOK (CLAUDE.md section 0). There is no KYC, no
# geolocation, no payment processing and no custody of funds anywhere in this
# spec, and no field that implies any of them. Do not add one.
# =============================================================================

openapi: 3.0.3

info:
  title: Sharpline API
  version: "1.0.0"
  summary: Real-time sports odds, play-money wagering, and line history.
  description: |
    Sharpline is a **play-money simulation of a sportsbook**, not a licensed
    sportsbook. No real money moves through this API. There is no deposit, no
    withdrawal, no payment instrument, no identity verification and no
    geolocation gating, and there never will be.

    All balances are play money and are derived by folding a double-entry
    ledger; no balance is stored as a mutable field anywhere in the system.

    Prices originate from an odds provider (or, in development, from a
    synthetic stochastic market maker) and are normalized and priced by the
    ingest and pricer services before they reach this API. Every price object
    reports the provider instant it was observed at so a client can compute
    staleness itself rather than trusting freshness by implication.
  license:
    name: Unlicensed - portfolio project
  contact:
    name: Sharpline

servers:
  - url: /api/v1
    description: |
      The reverse proxy (deploy/proxy/Caddyfile) forwards `/api/*` to this
      service WITHOUT stripping the prefix, so the paths below are absolute
      as written under `/api/v1`. The proxy is the only published port; this
      service is never addressed directly from a browser.

tags:
  - name: catalogue
    description: Sports, leagues, books, events and markets. Public, unauthenticated.
  - name: board
    description: The live odds board. Public, unauthenticated.
  - name: history
    description: Line movement from the Timescale hypertable. Public, unauthenticated.
  - name: auth
    description: Registration, login, refresh-token rotation and logout.
  - name: account
    description: Profile, derived play-money balance, self-imposed limits, TOTP.
  - name: betting
    description: |
      The bet slip, wager placement, wager history and cash-out. Every operation
      is authenticated and acts only on the token's own user.

security:
  - {}

paths:

  # ---------------------------------------------------------------------------
  # Catalogue
  # ---------------------------------------------------------------------------

  /sports:
    get:
      tags: [catalogue]
      operationId: listSports
      summary: Every sport in the catalogue.
      description: |
        Reads Postgres (`sports`). Single page: the row count is the number of
        sports the provider covers, which is single digits.
      responses:
        "200":
          description: The sports, by display name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SportPage" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /sports/{sportSlug}/leagues:
    get:
      tags: [catalogue]
      operationId: listLeaguesInSport
      summary: The leagues under one sport.
      description: |
        Reads Postgres (`leagues`, index `leagues_sport_idx`). Single page:
        bounded by the catalogue.
      parameters:
        - $ref: "#/components/parameters/SportSlug"
      responses:
        "200":
          description: The leagues, by display name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaguePage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /books:
    get:
      tags: [catalogue]
      operationId: listBooks
      summary: Every sportsbook whose lines are ingested.
      description: |
        Reads Postgres (`books`). Single page: bounded by the catalogue.

        `kind` and `is_reference` are both returned. A quote from a book of kind
        `synthetic` is a statement about a random number generator and a client
        MUST be able to label it as such; `is_reference` names the sharp book the
        pricer devigs against, which is the baseline every EV number is relative
        to.
      responses:
        "200":
          description: The books, by display name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookPage" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # Board
  # ---------------------------------------------------------------------------

  /board:
    get:
      tags: [board]
      operationId: getBoard
      summary: The live odds board across every league.
      description: |
        Tradeable events (`scheduled`, `live`, `suspended`) starting before
        `starting_before`, soonest first, with the current best price on each
        event's main markets.

        **Where this reads from.** Events and their market tree come from
        Postgres, which is the source of truth for the catalogue. Prices come
        from the `prices` hypertable through a bounded window
        (`LatestPriceForEachBookOnSelections`), which is a `DISTINCT ON` served
        entirely by `prices_natural_key_idx`. Redis fronts that read as a
        snapshot cache; a miss falls through to Postgres and the answer is
        identical either way, because CLAUDE.md section 3 makes Redis "never
        the source of truth". A suspended market is returned with
        `status: suspended` rather than hidden, because a suspension is usually
        seconds long and dropping the row would make the board flicker.

        **Staleness.** Every price carries `observed_at` (the provider's own
        instant) and `ingested_at` (when this system received it). Their
        difference is the provider-attributable share of the staleness SLO;
        `now() - observed_at` is total staleness. The API does not editorialise
        either number.
      parameters:
        - $ref: "#/components/parameters/StartingBefore"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/OddsFormatQuery"
        - $ref: "#/components/parameters/BookFilter"
      responses:
        "200":
          description: One page of the board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /leagues/{leagueSlug}/board:
    get:
      tags: [board]
      operationId: getLeagueBoard
      summary: The live odds board for one league.
      description: |
        Identical to `/board` but scoped to a league, and served by a different
        index (`events_league_board_idx`) because a cross-league query cannot use
        an index led by `league_id`.
      parameters:
        - $ref: "#/components/parameters/LeagueSlug"
        - $ref: "#/components/parameters/StartingBefore"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/OddsFormatQuery"
        - $ref: "#/components/parameters/BookFilter"
      responses:
        "200":
          description: One page of the league's board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /events/{eventId}:
    get:
      tags: [catalogue]
      operationId: getEvent
      summary: One event with its full market tree.
      description: |
        The event detail page: the event, its league and sport breadcrumb, every
        market on it, every selection under each market, and the current price
        from every quoting book on every selection.

        Selections are returned in `domain.SelectionRole.DisplayOrder()` --
        home, draw, away, over, under, outright -- which is not the
        lexicographic order of those strings and therefore cannot be produced by
        any SQL `ORDER BY`. The API sorts them so that every client renders the
        same tree.

        Not paginated: an event's market tree is bounded by the event.
      parameters:
        - $ref: "#/components/parameters/EventID"
        - $ref: "#/components/parameters/OddsFormatQuery"
        - $ref: "#/components/parameters/BookFilter"
      responses:
        "200":
          description: The event and its markets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /markets/{marketId}/prices:
    get:
      tags: [catalogue]
      operationId: compareMarketPrices
      summary: Multi-book comparison for one market.
      description: |
        Every book's current price on every selection of one market, plus the
        best price per selection and the market's overround at each book.

        This is the endpoint behind CLAUDE.md section 6's "multi-book
        comparison". The overround is computed here rather than stored: it is a
        pure function of the quotes returned in the same response
        (`odds.Overround`), so a client can check the arithmetic, and a stored
        copy would be a second truth able to disagree with the prices beside it.

        Not paginated: bounded by (selections on a market) x (books ingested).
      parameters:
        - $ref: "#/components/parameters/MarketID"
        - $ref: "#/components/parameters/OddsFormatQuery"
        - $ref: "#/components/parameters/BookFilter"
      responses:
        "200":
          description: The comparison grid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketComparison" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # History
  # ---------------------------------------------------------------------------

  /selections/{selectionId}/history:
    get:
      tags: [history]
      operationId: getSelectionHistory
      summary: Line movement for one selection at one book.
      description: |
        The reason the `prices` hypertable exists. Returns every quote one book
        made on one selection inside a half-open window `[from, to)`, oldest
        first, optionally downsampled.

        **The window is REQUIRED and is not a convenience.** `prices` is
        partitioned on `observed_at` in 12-hour chunks and migration 00004
        installs no retention policy, so the chunk count grows for the life of
        the deployment. A read with no lower bound defeats chunk exclusion and
        makes the planner consult an index on every chunk that has ever existed.
        There is deliberately no unbounded variant to reach for by accident.
        `to` defaults to now; `from` has no default and must be supplied.

        **Downsampling.** `resolution` selects a Timescale `time_bucket` width.
        `raw` returns every stored quote and is what a five-minute window wants;
        anything longer wants a bucket, because a market quoted every two seconds
        for a week is 300k points and no chart can draw them. A bucketed point
        reports `open`, `high`, `low`, `close` and `samples` for the bucket
        rather than a mean: the mean of a line is not a line anyone traded at,
        and open/close is what CLV and steam detection are computed from.

        `max_points` is a guard, not a page size -- a request whose window and
        resolution would exceed it is rejected `422` with the resolution that
        would fit, rather than being silently truncated into a chart that lies
        about where the line ended.
      parameters:
        - $ref: "#/components/parameters/SelectionID"
        - name: book
          in: query
          required: true
          description: |
            The book whose quotes to return, by slug. Required: a chart mixing
            two books' quotes on one series is not a line movement chart, it is
            two of them overlaid, and the caller must say which it wants.
          schema: { $ref: "#/components/schemas/Slug" }
        - name: from
          in: query
          required: true
          description: Inclusive lower bound on `observed_at` (RFC 3339).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: |
            Exclusive upper bound on `observed_at` (RFC 3339). Defaults to the
            time the request is served. Half-open so adjacent windows tile
            without double-counting the boundary quote.
          schema: { type: string, format: date-time }
        - name: resolution
          in: query
          required: false
          description: |
            Downsampling bucket width. `raw` returns stored quotes unaggregated.
          schema: { $ref: "#/components/schemas/HistoryResolution" }
        - name: max_points
          in: query
          required: false
          description: Reject (422) rather than truncate if the window would exceed this many points.
          schema: { type: integer, format: int32, minimum: 1, maximum: 5000, default: 1000 }
        - $ref: "#/components/parameters/OddsFormatQuery"
      responses:
        "200":
          description: The line movement series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistorySeries" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # Search
  # ---------------------------------------------------------------------------

  /search:
    get:
      tags: [catalogue]
      operationId: searchEvents
      summary: Find tradeable events by competitor name prefix.
      description: |
        Case-insensitive PREFIX match on either competitor's name, served by two
        partial expression indexes (`events_{home,away}_competitor_search_idx`,
        both `lower(col) text_pattern_ops`). Infix search would need a GIN
        trigram index and the `pg_trgm` extension, which migration 00002
        deliberately does not create; a type-ahead box wants prefix matching
        anyway.

        The status set here is NARROWER than the board's: `scheduled` and `live`
        only, which is exactly `domain.EventStatus.AcceptsWagers()`. The board
        shows a suspended event greyed out because a suspension is seconds long;
        this endpoint answers "what can I bet on", and a suspended market cannot
        be bet on. The accepted consequence is that an event is unfindable during
        a suspension.
      parameters:
        - name: q
          in: query
          required: true
          description: |
            Competitor name prefix. Matched literally -- `%` and `_` are escaped
            before the query, so a caller cannot turn a prefix search into a
            leading-wildcard scan.
          schema: { type: string, minLength: 2, maxLength: 64 }
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account.
      description: |
        Email and password only. There is no name, no address, no date of birth
        and no identity document, because CLAUDE.md section 0 rules out KYC
        entirely and migration 00005 has no column to put any of them in.

        The password is hashed with argon2id and the full PHC parameter string is
        stored, so the cost can be raised later and rehashed per user on their
        next successful login without a migration.

        A play-money grant is NOT issued here. Money enters a balance only
        through a double-entry ledger transaction, which is phase 8.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: The account was created and a session was opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: |
            An account already exists for that address.

            This endpoint DOES leak the existence of an address, and that is a
            deliberate, bounded trade: a registration form that accepts a
            duplicate silently is unusable, and the same fact is obtainable from
            any password-reset flow. `/auth/login` leaks nothing (see there).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for an access token and a refresh token.
      description: |
        **This endpoint does not enumerate users.** An unknown address and a
        wrong password produce byte-identical responses, the same status code,
        and the same timing: the handler runs a full argon2id verification
        against a fixed decoy hash when no user is found, so the expensive path
        is taken either way.

        If the account has a confirmed TOTP enrolment, a first call without
        `totp_code` returns `401` with `code: totp_required`. That response is
        only reachable AFTER the password has been verified, so it discloses
        nothing to someone who does not already hold the password.

        On success a new refresh-token FAMILY is started. The refresh token is
        returned once, in this response body, and never again; only its SHA-256
        reaches the database.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Credentials rejected, or a second factor is required. Indistinguishable
            between "no such account" and "wrong password".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            The account exists and the credentials are correct, but its status
            forbids a session -- `suspended`, `self_excluded` or `closed`. A
            self-excluded account cannot be logged into, which is the point of
            self-exclusion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate a refresh token for a new access token.
      description: |
        Redeeming a refresh token invalidates it and issues its successor, in one
        transaction. At any instant a family has exactly one live token.

        **Reuse detection.** Presenting a token that has already been redeemed
        means either an attacker is replaying a stolen token or the legitimate
        client is replaying one whose successor was stolen. The two are
        indistinguishable, so the only safe response is to revoke the ENTIRE
        family -- every descendant of the original login -- with reason
        `reuse_detected`, and force a fresh password authentication. The
        response is `401`, identical to the response for an unknown token: a
        thief must not learn from the status code that they tripped a detector.

        The detection is structural, not a read-then-write: a partial unique
        index (`refresh_tokens_one_successor`) permits at most one child per
        token, so two concurrent redemptions of the same token cannot both mint
        a successor whatever the application believed it read.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Rotated. The previous refresh token is now dead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Unknown, expired, revoked or already-redeemed token. All four are
            reported identically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the presented refresh token's entire family.
      description: |
        Revokes the family with reason `logout`, which ends every session
        descended from that login. Idempotent: logging out an already-revoked or
        unknown family returns `204`, because reporting "that token was already
        dead" is an enumeration oracle and there is nothing a caller can do with
        the distinction.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204":
          description: The family is revoked (or was already).
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # Account
  # ---------------------------------------------------------------------------

  /account:
    get:
      tags: [account]
      operationId: getAccount
      summary: The authenticated user's profile.
      description: |
        Email, status, when the account was created, and whether a TOTP second
        factor is enrolled and confirmed.

        **`status` is what a client renders the account state from.**
        `self_excluded` means the customer has stopped themselves through
        `POST /account/self-exclusion`: reads keep working and the session stays
        valid, but a placement or a top-up is refused `403 self_excluded`. A
        client should disable those controls rather than let the user discover
        it on submit. `suspended` and `closed` are operator states and block the
        same actions.

        There is nothing else, because migration 00005 stores nothing else: no
        legal name, no address, no date of birth, no document, no country, no
        jurisdiction. Their absence is a design decision recorded in that
        migration, not an unimplemented field.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /account/balance:
    get:
      tags: [account]
      operationId: getBalance
      summary: The authenticated user's derived play-money balance.
      description: |
        **The balance is DERIVED, never stored.** It is `sum(amount_minor)` over
        the user's ledger entries, read through the `account_balances` view.
        There is no balance column anywhere in the schema and migration 00006
        makes that a structural fact rather than a convention: a stored balance
        can be stale, and a bet slip validated against a stale balance is an
        overdraft.

        Two accounts are reported. `cash` is spendable; `escrow` holds the stakes
        of open wagers, which have left the spendable balance but have not yet
        been won or lost. Their sum is the user's total position.

        A user with no ledger movement yet returns zero balances with
        `entry_count: 0` -- correctly, and without inventing a grant. "This
        account was touched and nets to nothing" and "this account has never been
        touched" are different facts, and `entry_count` is what distinguishes
        them.

        If this fold ever becomes too slow the answer is a MATERIALISED VIEW
        refreshed from the ledger, never a mutable column on `users`: a
        materialised view can be provably rebuilt from the entries, a column
        cannot.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The derived balances.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /account/grant:
    post:
      tags: [account]
      operationId: grantPlayMoney
      summary: Credit the authenticated user's balance with play money.
      description: |
        **This is the only way money enters the system, and it is play money.**
        CLAUDE.md section 0 is explicit that this is a simulation: there is no
        deposit, no payment processor and no custody of funds. A grant is not a
        deposit and is not modelled as one -- it is the play-money analogue, the
        customer topping their own chips back up, and it is spelled `grant`
        everywhere for that reason.

        Every other money movement in the system is zero-sum between accounts
        that already hold a balance. Without this endpoint every balance is
        permanently zero and nothing can be wagered, which is why migration 00006
        says an empty ledger after `make up` is correct and that "money enters
        through EntryKindGrant, written by the application".

        The movement is double-entry like every other: `issuance` is debited and
        the customer's `user_cash` is credited, the two halves sum to exactly
        zero, and a deferred constraint trigger rejects the whole transaction at
        COMMIT if they do not.

        **The control on issuance is the customer's own limit, not an
        authorisation.** A `grant` limit under `/account/limits` caps how much
        may be credited per rolling period and is evaluated inside this
        transaction against the same ledger sum the limit is defined over. A
        per-request ceiling bounds a single call independently. A self-excluded
        account cannot top up at all, and neither can a suspended or closed one.

        **`Idempotency-Key` is REQUIRED**, and it matters more here than
        anywhere else in the API. The ledger transaction's identifier is derived
        from `(user, key)`, so a resubmitted grant collides with the primary key
        it already wrote and credits nobody twice. A doubled wager is a visible
        and refundable mistake; a doubled grant mints money into a ledger that
        still balances afterwards, because both halves are written, so nothing
        downstream would ever detect it.

        **`201` means credited now. `200` means credited earlier**, and the body
        reports what the ORIGINAL request credited -- not what this one asked
        for. Presenting a used key with a different amount returns the original
        movement unchanged, exactly as a replayed placement returns the original
        ticket.

        Audited: writes `ledger.grant` to the audit log against the ledger
        transaction, with the amount in minor units, inside the same transaction
        as the movement -- so the record of who minted the money commits with
        the money. This is the path where that matters most: a grant is the only
        operation in the system that CREATES value, and a doubled or
        unattributed one leaves a ledger that still balances, so the trail is
        the only place the anomaly would ever surface. A replay writes no entry,
        because it writes no money.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "200":
          description: |
            An idempotent replay. This key had already issued this grant; nothing
            was written by this request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantResponse" }
        "201":
          description: Credited. The balance has risen by `amount_minor`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            `self_excluded` -- a self-excluded customer may not top up. Reported
            distinctly from the other blocked statuses for the same reason it is
            on placement: it is the status the customer chose, and it earns a
            different response in kind.

            `account_not_active` -- suspended or closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            `invalid_grant_amount` -- not a positive amount within the
            per-request ceiling.

            `limit_exceeded` -- a self-imposed `grant` limit would be breached,
            with `invalid_params` naming the limit's kind and period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /account/self-exclusion:
    post:
      tags: [account]
      operationId: selfExclude
      summary: Stop yourself wagering, permanently.
      description: |
        The strongest of the responsible-gaming controls in CLAUDE.md section 6,
        and the only one that is not reversible. `POST /account/limits` caps how
        much may be staked, lost or granted in a period; this ends wagering
        outright.

        **It cannot be undone through this API, and that is structural rather
        than a matter of policy.** The statement behind it can move an account
        to `self_excluded` or `closed` and to no other status, and it refuses a
        source that is already one of those. So no request to this endpoint,
        no bug in a caller and no operator using the public API can reinstate a
        self-excluded account. Reinstatement is an operator action with a
        different actor, a different authorisation and a different audit action,
        and it belongs to the admin console -- which does not exist yet. A
        customer who takes this step and changes their mind cannot be served by
        this service today. That is stated plainly rather than softened, because
        a control described as reversible is not this control.

        **`confirm` must be the literal string `self_exclude`.** An action this
        final must not be reachable by an empty body or a mis-wired button.

        **It binds immediately for wagering.** The placement path reads
        `users.status` inside the placement transaction, against a row it has
        locked, so the next slip is refused `403 self_excluded` -- and so is the
        next top-up. Two backstops sit behind that read: this package maps the
        service's sentinel onto the response, and a BEFORE INSERT trigger on
        `wagers` (migration 00008) refuses the row for any writer that reached
        the table another way.

        **One request can still slip through, and it is bounded.** A placement
        that has already taken the lock on the customer's row completes; this
        request waits behind it and applies afterwards. The window is one
        in-flight transaction, it exists because the lock is what serialises the
        two, and it cannot admit a bet submitted after this call returns.

        **The access token stays valid.** Self-exclusion is not a logout and
        does not invalidate refresh-token families: locking a customer out of
        their own wager history and balance is not a protection, it is an
        obstacle to the person the control is for. `GET /account` reports the
        new `status` so a client can render the state, and the read surface
        keeps working.

        **Idempotent.** A customer who is already self-excluded gets `200` and
        their profile, not an error -- they have the outcome they asked for --
        and no second audit entry is written, because nothing changed.

        Audited: writes `user.self_exclude` to the audit log, with the before
        and after status, in the same transaction as the change.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfExclusionRequest" }
      responses:
        "200":
          description: |
            The account is self-excluded. The body is the profile as it now
            stands; `status` is `self_excluded`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: |
            `unprocessable` -- `confirm` was absent or was not `self_exclude`.
            Nothing was changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /account/limits:
    get:
      tags: [account]
      operationId: listLimits
      summary: The self-imposed limits currently in force.
      description: |
        Responsible-gaming-style self-imposed limits (CLAUDE.md section 6). The
        current limit for a `(kind, period)` pair is the one row with no
        `superseded_at`; superseded rows are history and are not returned here.

        There is no `deposit` limit and there will not be one: this system has no
        deposits. The play-money analogue is `grant`, which binds to the ledger
        entry kind of the same name -- the only way money enters a balance.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The limits in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [account]
      operationId: setLimit
      summary: Set or change a self-imposed limit.
      description: |
        **Tightening binds immediately. Loosening serves a cooling-off period.**
        That asymmetry is the entire point of the control: a limit a user can
        lift the instant they want to is not a limit. A request that lowers a
        money limit, shortens a session limit, or introduces a limit where there
        was none takes effect at `requested_at`; a request that raises or removes
        one takes effect after the cooling-off period and the response reports
        the `effective_from` instant so the user can see when.

        Rows are append-only history, never edited: the previous row is closed
        with `superseded_at` and a new one is written. "What limit was in force
        when this wager was accepted" must remain answerable, and an operator
        must not be able to make a customer's limit history disappear -- the
        database refuses both an UPDATE of the substantive columns and a DELETE.

        Audited: writes `user_limit.set` to the audit log with the before and
        after state.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetLimitRequest" }
      responses:
        "201":
          description: The limit was recorded. Check `effective_from`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: A concurrent request already superseded the limit this one was based on. Retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /account/totp:
    post:
      tags: [account]
      operationId: beginTOTPEnrolment
      summary: Begin TOTP enrolment.
      description: |
        Mints a shared secret, stores it as AEAD ciphertext under a key held
        outside the database, and returns the provisioning URI ONCE. The secret
        is not retrievable afterwards; a lost enrolment is restarted, not
        recovered.

        The enrolment is NOT active until `/account/totp/confirm` proves a code
        from it. An unconfirmed row must never be treated as an enrolled second
        factor -- otherwise a mis-scanned QR code locks the account out.

        Audited: `totp.enrol_begin`. The provisioning URI is never logged.
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Enrolment started. Store the URI now; it is not returned again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPEnrolment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: A confirmed enrolment already exists. Remove it first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [account]
      operationId: removeTOTP
      summary: Remove the TOTP second factor.
      description: |
        Requires a currently-valid code from the factor being removed, so that a
        stolen access token alone cannot strip the second factor.

        Audited: `totp.remove`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPCodeRequest" }
      responses:
        "204":
          description: Removed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No enrolment to remove.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /account/totp/confirm:
    post:
      tags: [account]
      operationId: confirmTOTPEnrolment
      summary: Prove a code and activate the TOTP second factor.
      description: |
        Audited: `totp.enrol_confirm`. The code is never logged.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPCodeRequest" }
      responses:
        "200":
          description: Confirmed. The factor is now required at login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No enrolment in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # Betting -- the slip, placement, history and cash-out
  #
  # FOUR RULES GOVERN EVERY OPERATION BELOW, AND THEY ARE WHY THE SHAPES LOOK
  # THE WAY THEY DO.
  #
  # 1. A LEG'S PRICE IS THE PRICE AT PLACEMENT AND IS NEVER RE-RESOLVED.
  #    CLAUDE.md section 4: "Legs hold the price *at placement time*, never a
  #    live reference." Migration 00006 makes that structural -- `legs` copies
  #    the book, the decimal, the line and the observed instant as VALUES, has
  #    no foreign key into the `prices` hypertable, and a trigger freezes every
  #    one of those columns after insert. So `decimal_odds` on a wager leg is a
  #    historical fact about what the customer took, not a quote. It does not
  #    move when the market does, and nothing on a placed wager will ever tell
  #    you the current line. Ask `/markets/{marketId}/prices` for that.
  #
  # 2. THE CUSTOMER NEVER SUPPLIES A PRICE, ONLY THE PRICE THEY SAW.
  #    Every leg submitted below carries `seen_decimal` and `seen_line` -- what
  #    was on screen. Those two numbers are the LEFT-HAND SIDE OF A COMPARISON
  #    and nothing else. The price that is booked is the one the service re-reads
  #    inside the placement transaction, so "the customer sent us the odds they
  #    wanted" is not a defect that can be introduced here; there is no request
  #    field that becomes a booked price.
  #
  #    When the two disagree the placement is REFUSED with `409 price_moved`
  #    carrying both numbers, and the client resubmits with `accepted_decimal`
  #    (and `accepted_line`) naming the new quote. A LINE MOVE IS NEVER WAVED
  #    THROUGH: "-3.5 at 1.91" and "-4 at 1.95" are different bets, so "better"
  #    is undefined across one and `accept_better_price` does not cover it.
  #
  # 3. MONEY IS `*_minor` INTEGERS, HERE AS EVERYWHERE. Stakes, payouts,
  #    profits, cash-out values and the cash-out margin's cash equivalent are
  #    all integer minor units. No endpoint below accepts or emits a
  #    major-unit number, a float amount or a string amount.
  #
  # 4. THE ROUNDING MODE IS NOT A REQUEST FIELD. `stake x price` is collapsed
  #    to whole minor units under a rule, and money.go is blunt that "a silent
  #    default is how a house edge appears in a ledger that nobody meant to put
  #    one in". The rule is therefore house policy, applied server-side and
  #    REPORTED on every quote and every wager as `rounding` -- never chosen by
  #    the caller, because a caller who could pick the rounding mode could pick
  #    the one that rounds their way.
  # ---------------------------------------------------------------------------

  /slip/quote:
    post:
      tags: [betting]
      operationId: quoteSlip
      summary: Price a bet slip without placing it.
      description: |
        What the frontend calls every time the slip changes. It validates the
        slip against the same rules placement will apply, re-reads the current
        quote on every leg, reports what moved, and returns the ticket price,
        the potential payout and the potential profit.

        **Nothing is written and no money moves.** No wager row, no leg, no
        ledger entry, no idempotency key, no audit entry. Every number in the
        response is read or computed; a client may call this as often as the
        user edits the slip.

        **A moved price is reported here, not refused.** `POST /wagers` answers
        `409` when a leg has moved and the move was not accepted; this endpoint
        answers `200` with `price_moved: true` and both numbers on the leg,
        because a quote whose whole job is to describe the current state should
        not fail when the state is interesting. The client renders the change
        and the user decides.

        **`placeable` is ADVISORY and `POST /wagers` is authoritative.** The
        impediments reported here are read outside a transaction and can be
        stale by the time the user presses Place. They exist so the button can
        be disabled with a reason rather than failing on submit. The placement
        service re-evaluates every one of them inside the placement transaction,
        under a lock on the customer's own row, and that is the only evaluation
        that decides anything.

        **One check is deliberately NOT attempted here: responsible-gaming
        limits.** Evaluating one is a period-scoped sum over `ledger_entries`
        taken under the placement lock, and computing it a second time on a read
        path would put two answers to a responsible-gaming control in the tree.
        The one that matters is the one the transaction uses, so a slip that
        would breach a self-imposed limit quotes as `placeable: true` here and
        is refused `422 limit_exceeded` on submit. That is the safe direction to
        be wrong in: the control still binds, and only the button's disabled
        state is optimistic.

        For a round robin, `stake_minor` is the stake on EACH generated ticket
        and `total_stake_minor` is that times `ticket_count` -- which is how
        books quote it and how customers think about it: a $5 round robin by 2s
        on four selections risks $30, not $5.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OddsFormatQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlipQuoteRequest" }
      responses:
        "200":
          description: The priced slip. Check `placeable` and `price_moved` before enabling Place.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlipQuote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: A leg names a selection that does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `market_unavailable` -- a market is suspended, closed or settled,
            its event is no longer accepting wagers, or no book is quoting a leg
            at all. The slip cannot be priced, so there is no quote to return
            and no partial one worth returning.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            The slip cannot be a ticket under any prices: two legs on one
            selection, a straight with more than one leg, a multi with fewer
            than two, teaser points on a non-teaser, a round-robin size larger
            than the selection count.

            Also the two shapes this book REFUSES TO PRICE rather than misprice:
            a same-game parlay, whose legs are correlated and which pricing as
            independent would overprice in the customer's favour, and a teaser,
            whose price is a posted ladder this deployment does not have.
            Refusing is the right failure: a wrong ticket price is frozen into
            an immutable row and is then wrong forever, in the direction nobody
            audits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /wagers:
    get:
      tags: [betting]
      operationId: listWagers
      summary: The authenticated user's wager history.
      description: |
        Newest first, keyset-paginated on `(placed_at, id)`. `placed_at` alone
        is not a total order -- a round robin writes N tickets at one instant --
        so the identifier is part of the key and a cursor is unambiguous.

        Filterable by status. **The filter is applied to the page the server
        scanned, so a filtered page may hold fewer than `limit` rows while
        `has_more` is still true.** Follow `next_cursor` until `has_more` is
        false rather than stopping at a short page. The alternative -- a
        dedicated statement per filter shape -- would multiply the query file
        and its index-plan gate for a parameter that is usually absent, and a
        page that is occasionally short is a far smaller cost than a page that
        is occasionally wrong.

        Every wager here belongs to the token's own user. There is no user
        parameter on this endpoint and none on `/wagers/{wagerId}` either.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/WagerStatusFilter"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/OddsFormatQuery"
      responses:
        "200":
          description: One page of wagers, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WagerPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [betting]
      operationId: placeWager
      summary: Place the slip.
      description: |
        Books the ticket and moves the stake from the customer's cash account
        into escrow, in ONE transaction with the wager and its legs. The
        double-entry rule holds without exception: the two halves of
        the stake movement sum to zero and a deferred constraint trigger rejects
        the whole transaction at COMMIT if they do not (CLAUDE.md section 4).

        **`Idempotency-Key` is REQUIRED.** The wager identifier is derived
        deterministically from `(user, idempotency_key)` -- and, for a round
        robin, additionally from the combination index -- so a replayed submit
        attempts to INSERT the primary key it already inserted and is refused by
        the database rather than by a lookup that could race. The service reads
        the existing wager back and answers `200` with it.

        That is why Redis can be, as CLAUDE.md section 3 requires, "never the
        source of truth" while placement is still exactly-once: Redis holds a
        short-TTL key that short-circuits the common replay before a transaction
        opens, and when Redis is down the placement proceeds and the answer is
        identical, because the derived primary key was doing the work all along.

        **`201` means booked now. `200` means booked earlier.** Both carry the
        same body. A client that retried after a timeout and cannot tell whether
        its first attempt landed learns the truth from the status line.

        **The key identifies the SUBMIT, not the slip.** The identifier is
        derived from the key and the user and from nothing in the body, so
        presenting a used key with a DIFFERENT slip returns the ORIGINAL wager
        unchanged -- it does not book the new one and does not error. That is
        the whole point of a derived identifier, and it is why a fresh key per
        intended action matters: a reused key is not a second bet.

        **Refusals, and which is which.** `403 self_excluded` for a
        self-excluded account -- read inside the placement transaction against a
        locked row, mapped here, and backstopped by a database trigger
        (migration 00008) so no writer at all can book a bet for an excluded
        customer. `403 account_not_active` for suspended or closed. `422
        insufficient_funds` when the balance will not cover the stake. `422
        limit_exceeded` when a self-imposed limit would be breached, with
        `invalid_params` naming the limit's kind and period. `409 price_moved`
        when a leg or the ticket price moved and the move was not accepted, with
        both numbers in `price_moves`. `409 market_unavailable` when a market
        suspended, an event stopped taking bets, a quote went stale or a book
        stopped quoting between the slip and the submit.

        Audited: writes `wager.place` to the audit log, ONE ENTRY PER BOOKED
        TICKET, inside the placement transaction. A round robin books N tickets
        and writes N entries -- three tickets is three state changes, each with
        its own id, and "what happened to ticket AC" has to stay answerable.
        Each entry carries the ticket's kind, stake, leg count, accepted price
        and potential payout in minor units, together with the request id, the
        client address and the trace ids.

        The entry commits with the wager and the stake movement or none of the
        three does. That is the only version of the requirement worth having: an
        audit row that can commit without its wager, or a wager that can commit
        without its audit row, is the gap the trail exists to close, and a
        best-effort write after the response would leave it one crash away from
        wrong. `POST /account/limits` works the same way for the same reason.

        **A replay writes no entry.** `200` means this request changed nothing,
        and an entry claiming it placed the wager would double-count the
        placement for anyone summing the trail.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceWagerRequest" }
      responses:
        "200":
          description: |
            An idempotent replay. This `Idempotency-Key` had already placed for
            this user; the body is the wager as it stands NOW, which may since
            have been graded or settled. Nothing was written by this request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Placement" }
        "201":
          description: Booked. The stake has moved from cash into escrow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Placement" }
        "400":
          description: |
            The body could not be understood, or the `Idempotency-Key` header is
            missing, empty or longer than 255 bytes. A malformed key is `400`
            and not `422` because the fault is in the request's framing rather
            than in what it asks for.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            `self_excluded` -- reported distinctly from the other blocked
            statuses because it is the one the customer chose, and it earns a
            different response in kind: a suspended account is told to contact
            support, a self-excluded one is told how their exclusion is managed.
            Collapsing the two would make the responsible-gaming path read as a
            punishment.

            `account_not_active` -- suspended or closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: A leg names a selection that does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `price_moved` -- a leg, or the whole ticket, is no longer offered at
            the number the customer saw. `price_moves` carries the seen and the
            current value for each, so the client shows exactly what changed and
            resubmits with `accepted_decimal` / `accepted_ticket_decimal` if the
            user takes it.

            `market_unavailable` -- a market suspended, closed or settled, the
            event stopped accepting wagers, the current quote is too old to bet
            against, or no book is quoting the selection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            `insufficient_funds` -- the cash balance, folded from the ledger
            under the placement lock, will not cover the total stake.

            `limit_exceeded` -- a self-imposed limit would be breached.
            `invalid_params` names the limit's kind and period.

            `unprocessable` -- the slip cannot be a ticket under any prices, or
            it is a shape this book refuses to price (a same-game parlay, a
            teaser).

            All three are `422` rather than `403`: the account is in good
            standing and the request is well-formed, and the same slip at a
            smaller stake, or tomorrow, is accepted. `403` is reserved for a
            standing condition on the account itself.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /wagers/{wagerId}:
    get:
      tags: [betting]
      operationId: getWager
      summary: One wager with its legs.
      description: |
        **Somebody else's wager is `404`, not `403`.** The ownership comparison
        happens in the adapter, on the row as it is read, and a mismatch becomes
        the same not-found the missing row produces -- so there is no branch
        anywhere above it that could tell the two apart.

        This is the one place this API answers `404` for something that exists,
        and the general rule it appears to break is stated in
        `components/responses/NotFound`: 404 is never used to signal an
        authorization failure. That rule's REASON was that this API had no
        per-user catalogue and therefore nothing whose existence a 404 could
        usefully conceal. Wagers are exactly such a catalogue, and here
        concealment is the point: a `403` on another customer's wager id would
        confirm the id exists, which is a wager-enumeration oracle over every
        customer of the book.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/WagerID"
        - $ref: "#/components/parameters/OddsFormatQuery"
      responses:
        "200":
          description: The wager and its legs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wager" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /wagers/{wagerId}/cashout:
    get:
      tags: [betting]
      operationId: getCashOutQuote
      summary: What the book will pay to close this wager now.
      description: |
        **The price is built from the FAIR value and then an explicitly named
        haircut is subtracted, so the book's take is a number you can read.**

            fair_value  = round(potential_payout x survival_probability)
            value       = round(fair_value x (1 - margin_bps / 10000))
            margin      = fair_value - value

        `survival_probability` is the product of the devigged fair probabilities
        of the legs still pending -- devigged against the sharp reference book
        per ADR 0006 -- times the graded multiplier of the legs already decided.
        `potential_payout` is what the book owes if the ticket wins, frozen at
        placement. Their product is what the position is worth to hold, and
        `margin_bps` is what the book charges to take it off the customer's
        hands.

        Quoting off the OFFERED price instead would take the same money and hide
        it inside the vig, entangled with the market's own margin, where "what
        did the book charge me to close early" would have no answer at all --
        the two margins are not separable from the outside. A named constant can
        be reviewed, alerted on and argued about. The take is identical either
        way; only its auditability changes.

        **When there is no quote there is no number.** `409` rather than a zero
        or a null, with a fixed message naming which condition applies: the
        wager is already terminal, a leg is void or pushed (which reprices the
        ticket, and repricing is settlement's job -- quoting off a payout known
        to be wrong is exactly the "plausible number of the right magnitude"
        failure), a pending leg's reference price is missing or older than the
        freshness window, or the computed value is not positive.

        **A quote is a snapshot at `quoted_at`, not an offer held open.** There
        is deliberately no expiry field: an expiry would imply the book is
        standing behind the number until then, and it is not. Whatever takes the
        cash-out re-prices while holding the wager row, exactly as placement
        re-reads a leg's price rather than trusting the one on the slip.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/WagerID"
      responses:
        "200":
          description: The current cash-out quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashOutQuote" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `cash_out_unavailable`. The `message` names which condition applies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [betting]
      operationId: takeCashOut
      summary: Take the cash-out.
      description: |
        Settles the wager at `cashed_out`, returns the value to the customer's
        cash account and releases the escrowed stake, in one balanced
        transaction with the wager update.

        **`accepted_value_minor` must be the value the customer was shown.** The
        service re-prices while holding the wager row and refuses with `409
        price_moved` if the number has changed, carrying the new one. Taking a
        cash-out at whatever the price happened to be when the request landed is
        the same defect as booking a bet at a moved line, and it is refused the
        same way.

        **`Idempotency-Key` is REQUIRED, with the same discipline as
        placement.** A replay answers `200` with the wager as it already stands
        rather than paying twice. There is no `201`: a cash-out creates no new
        resource, it drives an existing one to a terminal state.

        **Not yet audited, and unlike `POST /wagers` this one is still open.**
        CLAUDE.md section 6 requires an audit-log entry on every state-changing
        action; placement and `POST /account/grant` now write theirs inside
        their own transactions, and this operation would write `wager.cash_out`
        inside the settlement transaction on the same terms. No implementation
        of that port exists in this repository yet -- see the deployment note
        below -- so the requirement is recorded on the port rather than claimed
        here. Stated rather than omitted, because a reader comparing this
        against the two operations that ARE audited would otherwise assume
        parity.

        **Deployment note.** Executing a cash-out is a state transition on a
        placed ticket, and every other one of those belongs to `settle` --
        deliberately, because a component that could both quote and take a
        cash-out could do both in one transaction at a price of its own
        choosing. This operation is therefore mounted only when that port is
        wired; a deployment without it answers the spec's own `404` here and
        serves `GET` on the same path normally. `api` logs which shape it built
        at startup.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/WagerID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashOutRequest" }
      responses:
        "200":
          description: |
            The wager, now `cashed_out`, with `returned_minor` set to the value
            paid. Also the answer to an idempotent replay, in which case nothing
            was written by this request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wager" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The account is suspended, closed or self-excluded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `price_moved` -- the value changed since the quote; `price_moves`
            carries the new one.

            `cash_out_unavailable` -- no quote is available; the `message` names
            which condition applies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A short-lived JWT access token from `/auth/login` or `/auth/refresh`.

        The verifier PINS the signing algorithm and ignores the `alg` header on
        the presented token, so `alg: none` and an algorithm-confusion downgrade
        are both unrepresentable rather than merely rejected. Issuer, audience
        and expiry are all verified. Lifetime is minutes; durable session length
        comes from refresh-token rotation, not from a long-lived access token.

  parameters:

    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows in this page.
      schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 50 }

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque continuation token from a previous response's `page.next_cursor`.
        Do not construct or parse one. A cursor is bound to the ordering and the
        filters it was minted under and is rejected `400` if presented with
        different ones.
      schema: { type: string, maxLength: 512 }

    OddsFormatQuery:
      name: odds_format
      in: query
      required: false
      description: |
        Adds a rendered `display` string to every price. `decimal_odds` is always
        present regardless, because it is the canonical value and the other two
        formats are lossy.
      schema: { $ref: "#/components/schemas/OddsFormat" }

    BookFilter:
      name: book
      in: query
      required: false
      description: |
        Restrict prices to these books, by slug. Repeatable. Omitted means every
        book. An unknown slug is a `400`, not a silent empty result -- a typo
        that quietly returns nothing is the worst possible outcome for a price
        comparison.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 32
        items: { $ref: "#/components/schemas/Slug" }

    StartingBefore:
      name: starting_before
      in: query
      required: false
      description: |
        Upper bound on `scheduled_start` (RFC 3339). Defaults to 24 hours from
        the time the request is served, which is "today's board".
      schema: { type: string, format: date-time }

    SportSlug:
      name: sportSlug
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Slug" }

    LeagueSlug:
      name: leagueSlug
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Slug" }

    EventID:
      name: eventId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EntityID" }

    MarketID:
      name: marketId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EntityID" }

    SelectionID:
      name: selectionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EntityID" }

    WagerID:
      name: wagerId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EntityID" }

    WagerStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Restrict the page to these statuses. Repeatable, and the filter is a
        union -- `?status=placed&status=open` is "everything still running".
        Omitted means every status.

        The filter is applied to the page the server scanned, so a filtered page
        may be shorter than `limit` while `has_more` is still true. Follow
        `next_cursor` until `has_more` is false.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 7
        items: { $ref: "#/components/schemas/WagerStatus" }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A client-chosen key that makes a retry safe. REQUIRED on every operation
        that moves money, and refused rather than defaulted: without a key the
        resource identifier cannot be derived, so a retried submit -- which the
        network produces eventually whether the client meant it or not -- books a
        second bet. An endpoint that accepted a request with no key would have an
        at-least-once money path.

        The identifier is derived deterministically from `(user, this key)`, so a
        replayed submit collides with the primary key it already wrote and the
        service answers with the EXISTING resource instead of creating a second
        one. That is a property of a unique index rather than of a lookup that
        could race, which is why a retry is safe even when the first attempt's
        response never reached the client.

        The key identifies the SUBMIT, not the body: reusing one with a different
        slip returns the ORIGINAL resource unchanged. Use a fresh key per
        intended action and reuse it across retries of that action.
      schema:
        type: string
        minLength: 1
        maxLength: 255

  responses:

    BadRequest:
      description: The request was malformed -- a bad parameter, an unparseable body, an unknown book slug, an undecodable cursor.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Unauthorized:
      description: No access token, or one that failed verification.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: '`Bearer` with an error code, per RFC 6750.'

    NotFound:
      description: No such entity. Never used to signal an authorization failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    UnprocessableEntity:
      description: |
        Syntactically valid but semantically impossible -- a `from` after its
        `to`, a window and resolution that exceed `max_points`, a session limit
        denominated in money.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    TooManyRequests:
      description: |
        Rate limited. Limits are enforced per authenticated user AND per client
        IP, in Redis, so they hold across every replica rather than per pod.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      headers:
        Retry-After:
          schema: { type: integer, format: int32 }
          description: Seconds to wait before retrying.
        RateLimit-Remaining:
          schema: { type: integer, format: int32 }
        RateLimit-Reset:
          schema: { type: integer, format: int32 }

    InternalError:
      description: |
        Something failed inside the service. The response carries a `request_id`
        and nothing else; the cause is in the logs and the trace under that id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:

    # -------------------------------------------------------------------------
    # Primitives
    # -------------------------------------------------------------------------

    EntityID:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._-]+$'
      description: |
        A domain identifier. The charset is exactly `domain.validID`: `:` is
        excluded because WebSocket channels are `event:{id}` and a colon inside
        an identifier would make splitting a channel name ambiguous.
      example: "evt_nfl_2026_w1_kc_buf"

    Slug:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9_-]*$'
      example: "nfl"

    EmailAddress:
      type: string
      minLength: 3
      maxLength: 254
      pattern: '^[^\\s@]+@[^\\s@]+$'
      description: |
        An email address.

        The pattern is EXACTLY the database's `users_email_shape` CHECK -- one
        `@` with non-empty, whitespace-free sides -- and no tighter. Stricter
        regexes reject deliverable addresses (quoted local parts, single-label
        domains) and the only real proof an address exists is sending mail to it.

        Deliberately NOT `format: email`. That format makes oapi-codegen emit
        `openapi_types.Email`, which drags github.com/oapi-codegen/runtime into a
        module whose serving path otherwise has no third-party dependency at all,
        in exchange for a type alias over `string` that validates nothing at
        runtime. The pattern above is the validation, it is the same one the
        database enforces, and it costs nothing.

        Stored lowercase-normalised; the database CHECK makes that an invariant
        rather than a convention, so a plain unique index is a correct
        case-insensitive uniqueness constraint.
      example: "sharp@example.test"

    MoneyMinor:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: |
        An amount in MINOR UNITS (cents), as an integer. Never a float, never a
        string. The bound is 2^53-1, which is both the largest integer a float64
        holds exactly and JavaScript's `Number.MAX_SAFE_INTEGER`, and is the same
        bound the database CHECK constraints enforce -- so a JSON number is
        lossless for every value that can exist.
      example: 250000

    DecimalOdds:
      type: number
      format: double
      exclusiveMinimum: true
      minimum: 1.0
      maximum: 100000.0
      description: |
        Decimal odds -- the total return per unit staked, stake included. THE
        CANONICAL representation. American and fractional are derived and lossy.
      example: 1.909

    Probability:
      type: number
      format: double
      minimum: 0.0
      maximum: 1.0

    OddsFormat:
      type: string
      enum: [decimal, american, fractional]
      default: decimal

    HistoryResolution:
      type: string
      enum: [raw, 10s, 1m, 5m, 15m, 1h, 6h, 1d]
      default: raw

    EventStatus:
      type: string
      description: |
        Exactly `domain.EventStatus`, same spelling, same members. The API does
        not get to invent a status the domain cannot represent, and the domain
        does not get to add one without changing this list.
      enum: [scheduled, live, suspended, ended, settled, postponed, cancelled]

    MarketStatus:
      type: string
      description: Exactly `domain.MarketStatus`.
      enum: [open, suspended, closed, settled, voided]

    MarketType:
      type: string
      description: Exactly `domain.MarketType`.
      enum: [moneyline, spread, total, player_prop, futures]

    EventKind:
      type: string
      description: |
        Exactly `domain.EventKind`. `match` is a contest between two competitors;
        `outright` is a competition resolved among many runners and has no home
        or away side at all -- not empty ones.
      enum: [match, outright]

    SelectionRole:
      type: string
      description: Exactly `domain.SelectionRole`.
      enum: [home, draw, away, over, under, outright]

    BookKind:
      type: string
      description: |
        Exactly `domain.BookKind`. `synthetic` is the in-house stochastic market
        maker: a quote from it is a statement about a random number generator and
        every surface that renders one must be able to label it as such.
      enum: [external, synthetic]

    AccountStatus:
      type: string
      enum: [active, suspended, self_excluded, closed]

    LimitKind:
      type: string
      enum: [grant, stake, loss, session]
      description: |
        Deliberately NOT `deposit`: this system has no deposits (CLAUDE.md
        section 0). `grant`, `stake` and `loss` are spelled identically to the
        ledger entry kinds they are evaluated against, so enforcing a limit is a
        sum filtered by the same string with no translation table in between.

    LimitPeriod:
      type: string
      enum: [day, week, month, session]

    # -------------------------------------------------------------------------
    # Errors
    # -------------------------------------------------------------------------

    Error:
      type: object
      required: [code, message, request_id]
      additionalProperties: false
      description: |
        THE ONE ERROR SHAPE. Every non-2xx response in this API has exactly this
        body, so a client writes one decoder and one branch.

        `code` is a stable machine-readable token and is what a client should
        switch on; the HTTP status is a coarser classification of the same fact.
        `message` is a fixed human-readable string chosen from a closed set in
        Go. It is NEVER an error value, a driver message, a SQLSTATE, a stack
        frame, a file path or a query -- an error body is an untrusted output
        surface and everything a caller must not learn is logged under
        `request_id` and dropped here.

        `invalid_params` is present only for `400` and `422` and names the
        offending parameters so a form can highlight them. Its `reason` strings
        are equally fixed.
      properties:
        code:
          type: string
          enum:
            - bad_request
            - invalid_parameter
            - invalid_cursor
            - unauthenticated
            - invalid_credentials
            - totp_required
            - invalid_totp_code
            - forbidden
            - account_not_active
            - self_excluded
            - not_found
            - conflict
            - already_exists
            - price_moved
            - market_unavailable
            - cash_out_unavailable
            - unprocessable
            - insufficient_funds
            - limit_exceeded
            - invalid_grant_amount
            - rate_limited
            - internal
        message:
          type: string
          maxLength: 200
        request_id:
          type: string
          maxLength: 64
          description: |
            Correlates this response with the server log line and the trace span
            that produced it. Quote it in a bug report; it is the only handle on
            what actually happened.
        invalid_params:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/InvalidParam" }
        price_moves:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/PriceMove" }
          description: |
            Present only on `409 price_moved`, and the same device as
            `invalid_params`: one optional field on the ONE error shape rather
            than a second envelope, so a client still writes one decoder.

            It carries the number the customer was shown AND the number the
            service holds now, for every leg that moved. Both have to be here.
            Reporting only "something moved" would force the client to re-quote
            to find out what -- racing the next move, and showing the user a
            third number that was never the reason the request was refused.

    InvalidParam:
      type: object
      required: [name, reason]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
          description: The query parameter, path parameter or JSON pointer at fault.
        reason:
          type: string
          maxLength: 200

    # -------------------------------------------------------------------------
    # Pagination
    # -------------------------------------------------------------------------

    PageInfo:
      type: object
      required: [limit, has_more]
      additionalProperties: false
      description: |
        Keyset pagination. There is no total count and there will not be one:
        counting an unbounded, continuously-written set costs a full scan on
        every page and the number is stale before it is serialised.
      properties:
        limit:
          type: integer
          format: int32
          description: The page size actually applied, which may be smaller than the one requested.
        has_more:
          type: boolean
        next_cursor:
          type: string
          maxLength: 512
          nullable: true
          description: |
            Pass back as `cursor` for the next page. `null` when `has_more` is
            false. Opaque -- do not parse it.

    # -------------------------------------------------------------------------
    # Catalogue
    # -------------------------------------------------------------------------

    Sport:
      type: object
      required: [id, slug, name]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 200 }

    SportPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Sport" }
        page: { $ref: "#/components/schemas/PageInfo" }

    League:
      type: object
      required: [id, sport_id, slug, name]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        sport_id: { $ref: "#/components/schemas/EntityID" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 200 }

    LeaguePage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/League" }
        page: { $ref: "#/components/schemas/PageInfo" }

    Book:
      type: object
      required: [id, slug, name, kind, is_reference]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 200 }
        kind: { $ref: "#/components/schemas/BookKind" }
        is_reference:
          type: boolean
          description: |
            The sharp book the pricer devigs against to produce fair value. Every
            EV number in this system is relative to this book, so a client that
            renders EV must be able to name it.

    BookPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        page: { $ref: "#/components/schemas/PageInfo" }

    GameClock:
      type: object
      required: [running]
      additionalProperties: false
      description: Live clock state. Absent entirely on an event that has not started.
      properties:
        period: { type: integer, format: int32, nullable: true }
        elapsed_seconds: { type: integer, format: int64, nullable: true }
        running: { type: boolean }

    Score:
      type: object
      required: [home, away]
      additionalProperties: false
      properties:
        home: { type: integer, format: int32 }
        away: { type: integer, format: int32 }

    EventSummary:
      type: object
      required: [id, league_id, kind, name, scheduled_start, status, observed_at]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        league_id: { $ref: "#/components/schemas/EntityID" }
        kind: { $ref: "#/components/schemas/EventKind" }
        name: { type: string, maxLength: 200 }
        home_competitor: { $ref: "#/components/schemas/Competitor" }
        away_competitor: { $ref: "#/components/schemas/Competitor" }
        scheduled_start: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/EventStatus" }
        clock: { $ref: "#/components/schemas/GameClock" }
        score: { $ref: "#/components/schemas/Score" }
        observed_at:
          type: string
          format: date-time
          description: The provider instant this event's state was observed at.

    Competitor:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        name: { type: string, maxLength: 200 }

    Selection:
      type: object
      required: [id, market_id, role, name, prices]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        market_id: { $ref: "#/components/schemas/EntityID" }
        role: { $ref: "#/components/schemas/SelectionRole" }
        name: { type: string, maxLength: 200 }
        prices:
          type: array
          description: |
            The current price at each quoting book, ordered by book slug. Empty
            when no book has quoted this selection inside the freshness window --
            which is a correct answer, not a missing one.
          items: { $ref: "#/components/schemas/Price" }
        best_price:
          $ref: "#/components/schemas/Price"

    Price:
      type: object
      required: [book_id, book_slug, decimal_odds, implied_probability, observed_at, ingested_at]
      additionalProperties: false
      properties:
        book_id: { $ref: "#/components/schemas/EntityID" }
        book_slug: { $ref: "#/components/schemas/Slug" }
        decimal_odds: { $ref: "#/components/schemas/DecimalOdds" }
        implied_probability:
          allOf: [{ $ref: "#/components/schemas/Probability" }]
          description: |
            `1/decimal_odds`. WITH the book's vig still in it -- this is not a
            fair probability and must not be labelled as one in a UI. Returned
            because it is what a price cell's width or a bar chart is drawn from,
            and computing it client-side is one more place to get the reciprocal
            wrong.
        display:
          type: string
          maxLength: 32
          description: |
            The price rendered in the requested `odds_format`. Present only when
            `odds_format` is `american` or `fractional`; `decimal_odds` above is
            always authoritative.
        line:
          type: number
          format: double
          nullable: true
          description: The handicap or total this price was quoted at, when the market carries one.
        observed_at:
          type: string
          format: date-time
          description: The provider's own instant. The subtrahend in the staleness SLO.
        ingested_at:
          type: string
          format: date-time
          description: When this system received it. `ingested_at - observed_at` is the provider-attributable share of staleness.

    Market:
      type: object
      required: [id, event_id, type, status, observed_at, selections]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        event_id: { $ref: "#/components/schemas/EntityID" }
        type: { $ref: "#/components/schemas/MarketType" }
        line:
          type: number
          format: double
          nullable: true
        subject:
          type: string
          maxLength: 200
          nullable: true
          description: The player a prop market is about. Null on every other market type.
        status: { $ref: "#/components/schemas/MarketStatus" }
        observed_at: { type: string, format: date-time }
        selections:
          type: array
          items: { $ref: "#/components/schemas/Selection" }

    BoardEntry:
      type: object
      required: [event, markets]
      additionalProperties: false
      properties:
        event: { $ref: "#/components/schemas/EventSummary" }
        markets:
          type: array
          description: The event's markets with their selections and current prices.
          items: { $ref: "#/components/schemas/Market" }

    BoardPage:
      type: object
      required: [data, page, as_of]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/BoardEntry" }
        page: { $ref: "#/components/schemas/PageInfo" }
        as_of:
          type: string
          format: date-time
          description: |
            When this page was assembled. A client computes staleness against
            this rather than against its own clock, so a skewed browser clock
            cannot make a fresh board look stale.

    EventDetail:
      type: object
      required: [event, league, sport, markets, as_of]
      additionalProperties: false
      properties:
        event: { $ref: "#/components/schemas/EventSummary" }
        league: { $ref: "#/components/schemas/League" }
        sport: { $ref: "#/components/schemas/Sport" }
        markets:
          type: array
          items: { $ref: "#/components/schemas/Market" }
        as_of: { type: string, format: date-time }

    SearchHit:
      type: object
      required: [id, league_id, kind, name, scheduled_start, status]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        league_id: { $ref: "#/components/schemas/EntityID" }
        kind: { $ref: "#/components/schemas/EventKind" }
        name: { type: string, maxLength: 200 }
        home_competitor_name: { type: string, maxLength: 200, nullable: true }
        away_competitor_name: { type: string, maxLength: 200, nullable: true }
        scheduled_start: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/EventStatus" }

    SearchPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
        page: { $ref: "#/components/schemas/PageInfo" }

    # -------------------------------------------------------------------------
    # Multi-book comparison
    # -------------------------------------------------------------------------

    BookQuote:
      type: object
      required: [book_id, book_slug, book_name, book_kind, is_reference, quotes]
      additionalProperties: false
      properties:
        book_id: { $ref: "#/components/schemas/EntityID" }
        book_slug: { $ref: "#/components/schemas/Slug" }
        book_name: { type: string, maxLength: 200 }
        book_kind: { $ref: "#/components/schemas/BookKind" }
        is_reference: { type: boolean }
        overround:
          type: number
          format: double
          nullable: true
          description: |
            `sum(1/decimal_odds) - 1` over this book's quotes on the market --
            the book's margin. Null when the book has not quoted every selection,
            because an overround computed over a partial market is not a margin,
            it is a smaller number that looks like a better price.
        quotes:
          type: array
          items: { $ref: "#/components/schemas/SelectionQuote" }

    SelectionQuote:
      type: object
      required: [selection_id, role, decimal_odds, implied_probability, observed_at, ingested_at]
      additionalProperties: false
      properties:
        selection_id: { $ref: "#/components/schemas/EntityID" }
        role: { $ref: "#/components/schemas/SelectionRole" }
        decimal_odds: { $ref: "#/components/schemas/DecimalOdds" }
        implied_probability: { $ref: "#/components/schemas/Probability" }
        display: { type: string, maxLength: 32 }
        line: { type: number, format: double, nullable: true }
        observed_at: { type: string, format: date-time }
        ingested_at: { type: string, format: date-time }

    MarketComparison:
      type: object
      required: [market, books, best, as_of]
      additionalProperties: false
      properties:
        market:
          $ref: "#/components/schemas/MarketHeader"
        books:
          type: array
          description: Every book quoting this market, ordered by slug.
          items: { $ref: "#/components/schemas/BookQuote" }
        best:
          type: array
          description: |
            The best available price on each selection, and where it is. This is
            the input to arbitrage detection and it is computed here rather than
            left to the client so that "best" means one thing across every
            surface.
          items: { $ref: "#/components/schemas/BestPrice" }
        as_of: { type: string, format: date-time }

    MarketHeader:
      type: object
      required: [id, event_id, type, status, observed_at]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        event_id: { $ref: "#/components/schemas/EntityID" }
        type: { $ref: "#/components/schemas/MarketType" }
        line: { type: number, format: double, nullable: true }
        subject: { type: string, maxLength: 200, nullable: true }
        status: { $ref: "#/components/schemas/MarketStatus" }
        observed_at: { type: string, format: date-time }

    BestPrice:
      type: object
      required: [selection_id, role, book_id, book_slug, decimal_odds, observed_at]
      additionalProperties: false
      properties:
        selection_id: { $ref: "#/components/schemas/EntityID" }
        role: { $ref: "#/components/schemas/SelectionRole" }
        book_id: { $ref: "#/components/schemas/EntityID" }
        book_slug: { $ref: "#/components/schemas/Slug" }
        decimal_odds: { $ref: "#/components/schemas/DecimalOdds" }
        display: { type: string, maxLength: 32 }
        observed_at: { type: string, format: date-time }

    # -------------------------------------------------------------------------
    # History
    # -------------------------------------------------------------------------

    HistorySeries:
      type: object
      required: [selection_id, book_id, book_slug, resolution, from, to, points]
      additionalProperties: false
      properties:
        selection_id: { $ref: "#/components/schemas/EntityID" }
        book_id: { $ref: "#/components/schemas/EntityID" }
        book_slug: { $ref: "#/components/schemas/Slug" }
        resolution:
          allOf: [{ $ref: "#/components/schemas/HistoryResolution" }]
          description: The resolution actually applied. Equal to the one requested, or `raw` if none was.
        from: { type: string, format: date-time, description: Inclusive. }
        to: { type: string, format: date-time, description: Exclusive. }
        points:
          type: array
          items: { $ref: "#/components/schemas/HistoryPoint" }

    HistoryPoint:
      type: object
      required: [at, open, high, low, close, samples]
      additionalProperties: false
      description: |
        One point of a line-movement series. On `resolution: raw` every field but
        `samples` holds the same stored quote and `samples` is 1, so a client
        renders one shape whether or not it asked for downsampling.

        Open/high/low/close rather than a mean: the mean of a line is a price
        nobody traded at, and CLV and steam detection are both computed from the
        endpoints of a window, not from its average.
      properties:
        at:
          type: string
          format: date-time
          description: "The bucket's start instant (`raw`: the quote's `observed_at`)."
        open: { $ref: "#/components/schemas/DecimalOdds" }
        high: { $ref: "#/components/schemas/DecimalOdds" }
        low: { $ref: "#/components/schemas/DecimalOdds" }
        close: { $ref: "#/components/schemas/DecimalOdds" }
        close_display: { type: string, maxLength: 32 }
        line: { type: number, format: double, nullable: true, description: The line at the bucket's close. }
        samples: { type: integer, format: int32, minimum: 1 }

    # -------------------------------------------------------------------------
    # Auth
    # -------------------------------------------------------------------------

    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          allOf: [{ $ref: "#/components/schemas/EmailAddress" }]
          description: Normalised to lowercase before storage; the database CHECK makes that an invariant, not a convention.
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: |
            Minimum 12 characters and no composition rules. Length beats
            character-class requirements, which push users toward `Password1!`
            and toward reuse. Hashed with argon2id; never logged, never traced,
            never echoed.

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { $ref: "#/components/schemas/EmailAddress" }
        password: { type: string, maxLength: 256 }
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Required only if the account has a confirmed TOTP enrolment.

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 16
          maxLength: 512
          description: |
            The opaque refresh token from a previous session response. At least
            256 bits of `crypto/rand`; only its SHA-256 is stored, so a database
            leak yields no working tokens.

    SessionResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_at, account]
      additionalProperties: false
      description: |
        Returned by register, login and refresh. Both tokens are returned in the
        BODY and never set as cookies: this API is consumed cross-origin through
        a proxy by a Next.js client and by `pkg/client`, and a cookie-bearing
        API is a CSRF surface that would have to be defended with a second
        mechanism. The client stores the refresh token; the access token is held
        in memory.

        **The refresh token is shown exactly once.** It is not retrievable
        afterwards and it does not appear in any log, span or metric.
      properties:
        access_token:
          type: string
          description: "Short-lived JWT. Present it as `Authorization: Bearer <token>`."
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          format: int32
          description: Access-token lifetime in seconds. Minutes, not hours.
        refresh_token:
          type: string
          description: Opaque. Rotates on every use; reuse revokes the whole family.
        refresh_expires_at:
          type: string
          format: date-time
          description: |
            Absolute end of the login lineage, measured from when the family
            STARTED, not from this token's issue. Without that, a session
            rotated every ten minutes would live forever.
        account: { $ref: "#/components/schemas/Account" }

    # -------------------------------------------------------------------------
    # Account
    # -------------------------------------------------------------------------

    Account:
      type: object
      required: [id, email, status, totp_enrolled, created_at]
      additionalProperties: false
      description: |
        The whole profile. There is no name, address, date of birth, document,
        country or jurisdiction field, because this is not a licensed sportsbook
        and no such column exists (migration 00005). Their absence is deliberate.
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        email: { $ref: "#/components/schemas/EmailAddress" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        totp_enrolled:
          type: boolean
          description: True only for a CONFIRMED enrolment. An unconfirmed one is not a second factor.
        created_at: { type: string, format: date-time }

    AccountBalance:
      type: object
      required: [account_kind, balance_minor, entry_count]
      additionalProperties: false
      properties:
        account_kind: { type: string, enum: [user_cash, user_escrow] }
        balance_minor: { $ref: "#/components/schemas/MoneyMinor" }
        entry_count:
          type: integer
          format: int64
          description: |
            Ledger entries folded to produce this balance. Zero means the account
            has never moved -- a different fact from "moved and nets to zero",
            and the only thing that distinguishes them.

    BalanceResponse:
      type: object
      required: [currency, minor_units_per_major, cash, escrow, total_minor, as_of]
      additionalProperties: false
      properties:
        currency:
          type: string
          enum: [PLAY]
          description: |
            Not a real currency and deliberately not an ISO 4217 code. Labelling
            play money `USD` is the first step toward a client treating it as
            money, which CLAUDE.md section 0 forbids.
        minor_units_per_major:
          type: integer
          format: int32
          enum: [100]
          description: Divide by this only for DISPLAY. Never do arithmetic in major units.
        cash: { $ref: "#/components/schemas/AccountBalance" }
        escrow: { $ref: "#/components/schemas/AccountBalance" }
        total_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: cash + escrow. The user's total position.
        as_of: { type: string, format: date-time }

    GrantRequest:
      type: object
      required: [amount_minor]
      additionalProperties: false
      description: |
        A play-money top-up. There is no `transaction_id` field and there will
        not be one: the identifier is derived from `(user, Idempotency-Key)`,
        which is what makes a replay collide with its own primary key instead of
        crediting twice.
      properties:
        amount_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: |
            Minor units, and strictly positive. Zero is refused rather than
            accepted as a no-op: `ledger_entries` refuses a zero amount by CHECK,
            so a "successful" zero grant would report a transaction the database
            would have rejected.

            Bounded per request at 1000000 minor units. A customer wanting more
            submits again under a fresh key, bounded by their own `grant` limit
            while doing so.
          minimum: 1
          maximum: 1000000

    SelfExclusionRequest:
      type: object
      required: [confirm]
      additionalProperties: false
      description: |
        A customer asking the system to stop them. There is no `status` field
        and no `until` field: this endpoint means exactly one thing, and a
        duration would be a cooling-off period wearing self-exclusion's name.
      properties:
        confirm:
          type: string
          enum: [self_exclude]
          description: |
            Must be the literal string `self_exclude`. It exists so that this
            action cannot be taken by an empty body, a stray click on a
            mis-wired button, or a request assembled by a client that did not
            read what the endpoint does. A boolean would be weaker: `true` is
            what a checkbox sends by accident.

    GrantResponse:
      type: object
      required: [transaction_id, amount_minor, balance_minor, occurred_at, replayed]
      additionalProperties: false
      description: |
        The movement, and the balance it produced.
      properties:
        transaction_id:
          allOf: [{ $ref: "#/components/schemas/EntityID" }]
          description: |
            The derived ledger transaction. Returned so a client whose request
            timed out can look the movement up rather than guess whether it
            landed.
        amount_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: |
            What the transaction named here credited. On a replay this is what
            the ORIGINAL request credited, which need not be what this request
            asked for.
        balance_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: |
            The user's cash balance after the movement, folded over
            `ledger_entries` inside the transaction that wrote it. Derived, never
            stored.
        occurred_at: { type: string, format: date-time }
        replayed:
          type: boolean
          description: |
            True when this key had already issued the grant and nothing was
            written. Not an error; the status line says the same thing.

    Limit:
      type: object
      required: [id, kind, period, requested_at, effective_from, in_force]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        kind: { $ref: "#/components/schemas/LimitKind" }
        period: { $ref: "#/components/schemas/LimitPeriod" }
        amount_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          nullable: true
          description: Set on money kinds (`grant`, `stake`, `loss`); null on `session`.
        duration_seconds:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 86400
          description: Set on `session` only; null on money kinds.
        requested_at: { type: string, format: date-time }
        effective_from:
          type: string
          format: date-time
          description: |
            Equal to `requested_at` for a tightening. Later for a loosening
            serving its cooling-off period.
        in_force:
          type: boolean
          description: Whether `effective_from` has passed. A pending loosening is returned with `false`.

    LimitPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Limit" }
        page: { $ref: "#/components/schemas/PageInfo" }

    SetLimitRequest:
      type: object
      required: [kind, period]
      additionalProperties: false
      description: |
        Exactly one of `amount_minor` and `duration_seconds` must be present, and
        which one is determined by `kind`: `session` takes a duration, every
        other kind takes an amount. The database enforces the same biconditional,
        so an impossible combination is unstorable as well as rejected.

        Omitting both REMOVES the limit, which is a loosening and serves the
        cooling-off period like any other.
      properties:
        kind: { $ref: "#/components/schemas/LimitKind" }
        period: { $ref: "#/components/schemas/LimitPeriod" }
        amount_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          nullable: true
        duration_seconds:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 86400

    TOTPEnrolment:
      type: object
      required: [provisioning_uri, expires_at]
      additionalProperties: false
      description: |
        Returned ONCE. The shared secret is never retrievable afterwards and is
        stored only as AEAD ciphertext under a key held outside the database,
        with the user id as additional authenticated data so a row copied between
        users fails to decrypt rather than silently granting the attacker's
        device the victim's second factor.
      properties:
        provisioning_uri:
          type: string
          description: |
            `otpauth://totp/...`. CREDENTIAL MATERIAL -- it embeds the shared
            secret. Never logged, never traced, never persisted by a client
            beyond the moment the user scans it.
        expires_at:
          type: string
          format: date-time
          description: An unconfirmed enrolment expires. A stale one must not linger as a half-enrolled factor.

    TOTPCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Compared in constant time against the expected code for the current and adjacent time steps.

    # -------------------------------------------------------------------------
    # Betting
    #
    # Every money field below is `*_minor` and every one is an integer. Read the
    # note at the top of this document on why, and note the pair that is easiest
    # to get wrong: `potential_payout_minor` is the TOTAL RETURN with the stake
    # included, and `potential_profit_minor` is the NET WINNINGS. domain/wager.go
    # names them as bluntly as it does because "conflating return with profit
    # produces a plausible number of the right magnitude" -- which is the kind of
    # wrong number nobody catches in review.
    # -------------------------------------------------------------------------

    WagerKind:
      type: string
      description: |
        Exactly `domain.WagerKind`.

        A `round_robin` is not one bet. "A 3-team round robin by 2s" is three
        independent two-leg parlays -- AB, AC, BC -- each of which wins, loses
        and settles on its own, so placing one produces N tickets of this kind
        sharing a parent, and `Placement.wagers` carries all of them.
      enum: [straight, parlay, round_robin, teaser]

    WagerStatus:
      type: string
      description: |
        Exactly `domain.WagerStatus`. `placed` and `open` are running and hold
        escrow; the other five are terminal, and a terminal wager never
        transitions again.

        `void` and `push` both return the stake and are not the same fact:
        `void` is the book cancelling the bet, `push` is the bet being graded as
        a tie.
      enum: [placed, open, won, lost, void, push, cashed_out]

    LegStatus:
      type: string
      description: |
        Exactly `domain.LegStatus`. Legs grade independently and at different
        times, because they are on different games -- so a running parlay may
        legitimately show a mix of `won`, `lost` and `pending`.
      enum: [pending, won, lost, void, push]

    Rounding:
      type: string
      description: |
        Exactly `domain.Rounding`: the rule `stake x price` was collapsed under.

        It is REPORTED and never accepted. A caller who could choose the
        rounding mode could choose the one that rounds their way, so this is
        house policy applied server-side. It travels on every quote and every
        wager because a later recomputation -- a partially-voided parlay
        repriced at settlement -- must use the rule the ticket was written
        under, and because it is what makes `potential_payout_minor`
        reproducible from `stake_minor` and `decimal_odds`.
      enum: [half_away_from_zero, half_to_even, toward_zero]

    TicketDecimalOdds:
      type: number
      format: double
      exclusiveMinimum: true
      minimum: 1.0
      maximum: 1000000000.0
      description: |
        The price of a whole TICKET -- total return per unit staked with every
        leg winning.

        The upper bound is `domain.MaxWagerDecimal` (1e9) and NOT `DecimalOdds`'
        1e5. The difference is deliberate rather than sloppy: 1e5 bounds a single
        quoted market price, while a 20-leg parlay of even-money legs is 2^20 =
        1.05e6 in decimal odds -- a perfectly ordinary ticket that the
        market-price bound would wrongly reject.
      example: 6.42

    # ---- Submitting a slip --------------------------------------------------

    SlipLeg:
      type: object
      required: [selection_id, book_id, seen_decimal]
      additionalProperties: false
      description: |
        One selection on a slip, at one book, together with the quote the
        customer had on screen.

        `seen_decimal` and `seen_line` are NOT the price that gets booked. They
        are the left-hand side of a comparison and nothing else.
      properties:
        selection_id: { $ref: "#/components/schemas/EntityID" }
        book_id:
          allOf: [{ $ref: "#/components/schemas/EntityID" }]
          description: |
            Which book's line the customer took. Required, not defaulted:
            "best price" is a rendering decision the client already made when it
            put a number on screen, and re-deriving it server-side could book a
            different book's line than the one that was clicked.
        seen_decimal:
          allOf: [{ $ref: "#/components/schemas/DecimalOdds" }]
          description: The decimal price that was on screen. Decimal only -- American and fractional are display formats, converted at the edge and discarded.
        seen_line:
          type: number
          format: double
          nullable: true
          description: |
            The line that was on screen, FROM THIS SELECTION'S OWN PERSPECTIVE
            -- already inverted for an away spread, exactly as the board
            rendered it. `null` on a moneyline or a futures market; a present
            `0.0` is a traded pick'em, which is a different fact from "no line".

            It is compared as strictly as the price is. A line move is a
            different bet, so it is never waved through.

    PlacementLeg:
      type: object
      required: [selection_id, book_id, seen_decimal]
      additionalProperties: false
      description: |
        `SlipLeg` plus the accept-the-move fields, which mean nothing on a quote
        and are therefore not on `SlipLeg`.
      properties:
        selection_id: { $ref: "#/components/schemas/EntityID" }
        book_id: { $ref: "#/components/schemas/EntityID" }
        seen_decimal: { $ref: "#/components/schemas/DecimalOdds" }
        seen_line:
          type: number
          format: double
          nullable: true
        accepted_decimal:
          allOf: [{ $ref: "#/components/schemas/DecimalOdds" }]
          nullable: true
          description: |
            The re-quoted price the customer has explicitly agreed to, set when
            resubmitting after a `409 price_moved`.

            It is a SEPARATE field from `seen_decimal` rather than an overwrite
            of it, and that is the design: overwriting would make "the customer
            accepted a move" indistinguishable from "the customer never saw
            one", so a client that simply echoed back whatever the server last
            said would silently opt every user into every future move.

            It must match the CURRENT quote, not the one that prompted it. An
            acceptance of a price that has itself since moved is refused again,
            with the newer numbers.
        accepted_line:
          type: number
          format: double
          nullable: true
          description: |
            The re-quoted line agreed to, alongside `accepted_decimal`. Naming
            the line as well as the price is what makes an acceptance meaningful
            across a line move: "yes, book me at 1.95" is not consent to a
            different handicap, and a book that read it as consent would be
            moving the customer's bet.

    SlipQuoteRequest:
      type: object
      required: [kind, stake_minor, legs]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/WagerKind" }
        stake_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: |
            Strictly positive. For a round robin this is the stake on EACH
            generated ticket, not the total -- see `total_stake_minor` in the
            response.
        legs:
          type: array
          minItems: 1
          maxItems: 25
          items: { $ref: "#/components/schemas/SlipLeg" }
          description: |
            `maxItems` is `domain.MaxWagerLegs`, which is also
            `odds.MaxParlayLegs` -- a longer ticket could not be priced either.
            A straight takes exactly one leg; a parlay, teaser or round robin
            takes at least two. A round robin additionally caps at
            `domain.MaxRoundRobinLegs` (10), because its ticket count is a
            binomial coefficient: at 20 selections it would be a million
            tickets, which is not a large bet, it is a denial of service against
            the settlement path.
        teaser_points:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 20.0
          description: |
            Present exactly on a teaser and refused on every other kind. The
            points EVERY leg's line moves by, in the leg's own favour.
        round_robin_sizes:
          type: array
          nullable: true
          maxItems: 9
          items: { type: integer, format: int32, minimum: 2, maximum: 10 }
          description: |
            Present exactly on a round robin. `[2]` is "by 2s", `[2, 3]` is "by
            2s and 3s". Each size is at least 2 and at most the leg count.
            Sorted and de-duplicated server-side, so `[3, 2, 3]` and `[2, 3]`
            describe the same round robin.
        seen_ticket_decimal:
          allOf: [{ $ref: "#/components/schemas/TicketDecimalOdds" }]
          nullable: true
          description: |
            The whole-ticket price the customer was last shown, if any. Supplied
            only so the response can report ticket-level movement; a first quote
            omits it. Never meaningful on a round robin, whose combinations are
            separate tickets at separate prices.

    PlaceWagerRequest:
      type: object
      required: [kind, stake_minor, legs]
      additionalProperties: false
      description: |
        The same slip as `SlipQuoteRequest`, with `PlacementLeg` in place of
        `SlipLeg` so a leg can carry an acceptance.

        There is no `wager_id` field and there will not be one. The identifier is
        derived from `(user, Idempotency-Key)` by a stable hash, which is what
        makes a replay collide with its own primary key instead of producing a
        second ticket. A client-chosen id would let one client collide with
        another's.

        There is no `rounding` field either -- see the note at the top of the
        betting paths.
      properties:
        kind: { $ref: "#/components/schemas/WagerKind" }
        stake_minor: { $ref: "#/components/schemas/MoneyMinor" }
        legs:
          type: array
          minItems: 1
          maxItems: 25
          items: { $ref: "#/components/schemas/PlacementLeg" }
        teaser_points:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 20.0
        round_robin_sizes:
          type: array
          nullable: true
          maxItems: 9
          items: { type: integer, format: int32, minimum: 2, maximum: 10 }
        seen_ticket_decimal:
          allOf: [{ $ref: "#/components/schemas/TicketDecimalOdds" }]
          nullable: true
          description: |
            The whole-ticket price the customer was shown. REQUIRED in practice
            for a parlay and a teaser, where the ticket price is not any leg's
            price and the customer is quoted a separate number, and where
            omitting it would let the ticket be booked at a price nobody agreed
            to. Optional on a straight, where the ticket price must equal the
            single leg's anyway; supplying it there costs one comparison and
            catches a client computing the number itself. Never sent on a round
            robin.
        accepted_ticket_decimal:
          allOf: [{ $ref: "#/components/schemas/TicketDecimalOdds" }]
          nullable: true
          description: The re-quoted ticket price explicitly agreed to, in the same shape as a leg's `accepted_decimal`.
        accept_better_price:
          type: boolean
          default: false
          description: |
            Opt in to booking a LONGER price at an UNCHANGED line without a
            further round trip.

            Every real book takes an improvement without asking. This one does
            not unless asked, and the reason is narrow: "accept when the new
            price is longer" and "accept when the new price is shorter" are one
            comparison operator apart, and the difference between them is
            invisible in review and invisible in every test where the line does
            not move. So the concession is real, but it is explicit and it is on
            the slip, where a reader can see the customer asked for it -- which
            is also how books actually model it, as a setting rather than a
            silent policy.

            It NEVER covers a shorter price and NEVER covers a line move.

    # ---- The priced slip ----------------------------------------------------

    PriceMovement:
      type: string
      description: |
        Named from the customer's side rather than as `up`/`down`, because "the
        odds went up" is ambiguous in exactly the direction that matters.
        `lengthened` pays MORE per unit staked than the customer saw;
        `shortened` pays less.
      enum: [unchanged, lengthened, shortened]

    SlipQuoteLeg:
      type: object
      required:
        [selection_id, book_id, book_slug, market_id, market_type, market_status,
         event_id, role, seen_decimal, current_decimal, movement, tradeable,
         observed_at]
      additionalProperties: false
      description: |
        One leg of a priced slip: what the customer saw, what the market says
        now, and whether it can still be taken.
      properties:
        selection_id: { $ref: "#/components/schemas/EntityID" }
        book_id: { $ref: "#/components/schemas/EntityID" }
        book_slug: { $ref: "#/components/schemas/Slug" }
        market_id: { $ref: "#/components/schemas/EntityID" }
        market_type: { $ref: "#/components/schemas/MarketType" }
        market_status: { $ref: "#/components/schemas/MarketStatus" }
        event_id: { $ref: "#/components/schemas/EntityID" }
        event_status: { $ref: "#/components/schemas/EventStatus" }
        role: { $ref: "#/components/schemas/SelectionRole" }
        seen_decimal:
          allOf: [{ $ref: "#/components/schemas/DecimalOdds" }]
          description: Echoed from the request -- the number the customer saw.
        seen_line:
          type: number
          format: double
          nullable: true
          description: Echoed from the request.
        current_decimal:
          allOf: [{ $ref: "#/components/schemas/DecimalOdds" }]
          description: The newest quote from this book on this selection.
        current_display:
          type: string
          nullable: true
          description: |
            `current_decimal` rendered in the requested `odds_format`. Null when
            the format is `decimal`, which is canonical and always present.
        current_line:
          type: number
          format: double
          nullable: true
          description: |
            The line the current quote is made at, from this selection's own
            perspective. Null on a market that carries none; `0.0` is a real
            traded pick'em.
        movement: { $ref: "#/components/schemas/PriceMovement" }
        line_moved:
          type: boolean
          description: |
            Reported separately from `movement` because it is a different
            question. `movement` compares two prices; this compares two BETS. A
            spread of -4 loses games that -3.5 wins, so a leg whose line moved
            needs an explicit acceptance naming the new line even when the price
            improved.
        tradeable:
          type: boolean
          description: |
            False when the market is suspended, closed or settled, when the event
            is no longer accepting wagers, or when the newest quote is older than
            the freshness window. One false leg makes the whole slip unplaceable.
        observed_at:
          type: string
          format: date-time
          description: The provider's instant for `current_decimal`, so the client computes staleness itself rather than trusting freshness by implication.

    SlipImpediment:
      type: object
      required: [code, message]
      additionalProperties: false
      description: |
        One reason the slip cannot be placed right now.

        Deliberately NOT the `Error` envelope: this is a `200` describing a
        priced slip, and forcing the two shapes together would make a client
        branch on "is this an error body or a quote body" for a response that is
        always a quote. `code` is drawn from the same token vocabulary as
        `Error.code`, so a client's code-to-message table is one table either
        way.

        `limit_exceeded` is NOT in this enum. Evaluating a self-imposed limit is
        a period-scoped sum over the ledger taken under the placement lock, and
        a second evaluation on a read path would be a second answer to a
        responsible-gaming control. `POST /wagers` is the only evaluator.
      properties:
        code:
          type: string
          enum:
            - self_excluded
            - account_not_active
            - insufficient_funds
            - market_unavailable
            - price_moved
        message:
          type: string
          maxLength: 200
          description: A fixed human-readable string from a closed set in Go, exactly as `Error.message` is.
        selection_id:
          allOf: [{ $ref: "#/components/schemas/EntityID" }]
          nullable: true
          description: Set when the impediment belongs to one leg; null when it belongs to the whole slip.

    SlipQuote:
      type: object
      required:
        [kind, stake_minor, ticket_count, total_stake_minor,
         potential_payout_minor, potential_profit_minor, rounding, legs,
         price_moved, placeable, impediments, cash_balance_minor, as_of]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/WagerKind" }
        stake_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: The stake on ONE ticket, echoed from the request.
        ticket_count:
          type: integer
          format: int32
          minimum: 1
          description: |
            1 for a straight, parlay or teaser. For a round robin, the number of
            combinations its sizes expand to -- the sum of C(n, k) over them.
        total_stake_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: '`stake_minor` x `ticket_count`. What the customer actually risks, and what the affordability check is made against.'
        decimal_odds:
          allOf: [{ $ref: "#/components/schemas/TicketDecimalOdds" }]
          nullable: true
          description: |
            The ticket price as it stands now. NULL for a round robin, whose
            combinations are independent tickets at different prices: a single
            headline number there would be an average nobody is offered.
        seen_ticket_decimal:
          allOf: [{ $ref: "#/components/schemas/TicketDecimalOdds" }]
          nullable: true
          description: Echoed from the request when it carried one.
        ticket_movement:
          allOf: [{ $ref: "#/components/schemas/PriceMovement" }]
          nullable: true
          description: '`decimal_odds` against `seen_ticket_decimal`. Null when the request carried no seen ticket price.'
        potential_payout_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: |
            TOTAL RETURN if every leg wins, STAKE INCLUDED. For a round robin,
            summed across every combination, since all of them win when all the
            selections do.
        potential_profit_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: 'NET WINNINGS: `potential_payout_minor` - `total_stake_minor`.'
        rounding: { $ref: "#/components/schemas/Rounding" }
        is_same_game:
          type: boolean
          description: |
            True when every leg is on one event. Worth surfacing because a
            same-game ticket is priced with a correlation adjustment and is
            therefore NOT the product of its leg prices -- a client that
            multiplied the legs itself would get a different, larger number and
            would look right. This deployment refuses to price one at all rather
            than approximate it.
        legs:
          type: array
          items: { $ref: "#/components/schemas/SlipQuoteLeg" }
        price_moved:
          type: boolean
          description: True when any leg's `movement` is not `unchanged`, any leg's line moved, or the ticket price moved.
        placeable:
          type: boolean
          description: |
            ADVISORY, and false exactly when `impediments` is non-empty. The
            balance and the market states behind it are read outside a
            transaction and can be stale by the time the user presses Place;
            `POST /wagers` re-evaluates all of it inside the placement
            transaction and is the only evaluation that decides anything.
        impediments:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/SlipImpediment" }
          description: Empty when `placeable` is true. Never null.
        cash_balance_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: |
            The spendable balance the affordability check was made against,
            folded from the ledger at `as_of`. Reported so a client renders "you
            have X" beside "this costs Y" from ONE read rather than from two
            that can disagree.
        as_of:
          type: string
          format: date-time

    # ---- Placed wagers ------------------------------------------------------

    WagerLeg:
      type: object
      required:
        [id, event_id, market_id, market_type, selection_id, role, status,
         book_id, book_slug, decimal_odds, price_observed_at]
      additionalProperties: false
      description: |
        One selection on a placed ticket, holding THE PRICE AT PLACEMENT TIME.

        `book_id`, `decimal_odds`, `line` and `price_observed_at` are a copied
        `domain.Price` VALUE, not a reference into the price series, and the
        database freezes every one of them after insert. They describe what the
        customer took; they do not track the market and no request can make them.

        `price_observed_at` is when the QUOTE was seen, not when the bet was
        placed -- that is the wager's `placed_at`. Their difference is how stale
        the price the customer took already was, which is the headline staleness
        SLO's question asked about a settled ticket.
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        event_id: { $ref: "#/components/schemas/EntityID" }
        market_id: { $ref: "#/components/schemas/EntityID" }
        market_type: { $ref: "#/components/schemas/MarketType" }
        selection_id: { $ref: "#/components/schemas/EntityID" }
        role: { $ref: "#/components/schemas/SelectionRole" }
        status: { $ref: "#/components/schemas/LegStatus" }
        book_id: { $ref: "#/components/schemas/EntityID" }
        book_slug: { $ref: "#/components/schemas/Slug" }
        decimal_odds:
          allOf: [{ $ref: "#/components/schemas/DecimalOdds" }]
          description: The price AT PLACEMENT. Never re-resolved, never updated.
        display:
          type: string
          nullable: true
          description: '`decimal_odds` in the requested `odds_format`. Null when the format is `decimal`.'
        line:
          type: number
          format: double
          nullable: true
          description: |
            The line the price was quoted at, from this selection's own
            perspective. Null on a market with no line; `0.0` is a stored
            pick'em.
        teased_line:
          type: number
          format: double
          nullable: true
          description: |
            The moved line a teaser leg actually grades at. The leg keeps the
            REAL price it was booked against beside it rather than forging a
            price at the moved line -- the book never traded there, and a forged
            quote would corrupt line history and destroy CLV.
        grading_line:
          type: number
          format: double
          nullable: true
          description: 'The line this leg grades at: `teased_line` when present, otherwise `line`.'
        price_observed_at:
          type: string
          format: date-time
        graded_at:
          type: string
          format: date-time
          nullable: true
          description: Set exactly when `status` is not `pending`. Per leg, because the legs of a parlay grade at different times.

    Wager:
      type: object
      required:
        [id, kind, status, stake_minor, decimal_odds, rounding,
         potential_payout_minor, potential_profit_minor, legs, placed_at,
         updated_at]
      additionalProperties: false
      description: |
        One placed ticket.

        `decimal_odds`, `rounding` and `potential_payout_minor` are FROZEN AT
        PLACEMENT and are never recomputed. A parlay's price is not always the
        product of its legs -- same-game legs carry a correlation adjustment, a
        teaser's price is a posted ladder that has nothing to do with the
        underlying prices at all -- so re-deriving it later would produce a
        different number than the customer was shown and accepted. "To win $X"
        is a promise, and a promise recomputed later is not one.
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        kind: { $ref: "#/components/schemas/WagerKind" }
        status: { $ref: "#/components/schemas/WagerStatus" }
        stake_minor: { $ref: "#/components/schemas/MoneyMinor" }
        decimal_odds:
          allOf: [{ $ref: "#/components/schemas/TicketDecimalOdds" }]
          description: The ticket price the customer accepted.
        display:
          type: string
          nullable: true
          description: '`decimal_odds` in the requested `odds_format`.'
        rounding: { $ref: "#/components/schemas/Rounding" }
        potential_payout_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: TOTAL RETURN if every leg wins, stake included.
        potential_profit_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: 'NET WINNINGS: payout minus stake.'
        teaser_points:
          type: number
          format: double
          nullable: true
          description: Present exactly on a teaser.
        round_robin_id:
          allOf: [{ $ref: "#/components/schemas/EntityID" }]
          nullable: true
          description: |
            Present exactly on a round-robin ticket, naming the parent the
            combination was expanded from. Every sibling ticket carries the same
            value and the same `stake_minor`.
        returned_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          nullable: true
          description: |
            What settlement actually paid back -- the ONLY authority on what the
            ticket returned. A partially-voided parlay returns less than
            `potential_payout_minor`, and a cash-out returns whatever price was
            taken. NULL exactly while the ticket is still running.
        net_return_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          nullable: true
          description: '`returned_minor` - `stake_minor`. NEGATIVE on a loser. Null while running.'
        legs:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WagerLeg" }
        placed_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: |
            The instant of the most recent transition, from the acting service's
            clock -- not row bookkeeping. A redelivered settlement message
            re-applies the ORIGINAL instant rather than the wall clock.
        settled_at:
          type: string
          format: date-time
          nullable: true
          description: |
            `updated_at` once `status` is terminal, and null before then. It is
            not a separate stored field: a second copy of the same instant is a
            second thing to keep in agreement.

    RoundRobinTicketSet:
      type: object
      required: [id, selection_count, sizes, stake_per_combination_minor, combination_count]
      additionalProperties: false
      description: |
        The parent of an expanded round robin. Its own selection set is NOT
        reported here, because it is exactly the union of the tickets' legs and
        a second copy could disagree with the tickets it supposedly generated --
        and the copy, not the tickets, is the one nobody would notice was wrong.
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        selection_count:
          type: integer
          format: int32
          minimum: 2
          maximum: 10
          description: 'The `n` in C(n, k).'
        sizes:
          type: array
          items: { type: integer, format: int32, minimum: 2, maximum: 10 }
          description: Ascending and de-duplicated -- the canonical order the domain stores.
        stake_per_combination_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: The stake on EACH ticket, not the total.
        combination_count:
          type: integer
          format: int32
          minimum: 1
          description: 'Sum of C(n, k) over `sizes`. Equal to the length of `Placement.wagers`.'

    Placement:
      type: object
      required: [wagers, total_stake_minor, potential_payout_minor, potential_profit_minor, replayed]
      additionalProperties: false
      description: |
        The result of a placement. `wagers` holds one ticket for a straight,
        parlay or teaser, and every expanded combination for a round robin --
        which is why this is an array rather than a single wager even in the
        overwhelmingly common one-ticket case. A shape that changed with the kind
        would make every client write the branch this array removes.
      properties:
        wagers:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Wager" }
        round_robin:
          allOf: [{ $ref: "#/components/schemas/RoundRobinTicketSet" }]
          nullable: true
          description: Present exactly when the tickets are of kind `round_robin`.
        total_stake_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: Summed across every ticket. What left the cash balance and now sits in escrow.
        potential_payout_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: TOTAL RETURN across every ticket if every selection wins, stake included.
        potential_profit_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: '`potential_payout_minor` - `total_stake_minor`.'
        replayed:
          type: boolean
          description: |
            True when this `Idempotency-Key` had already placed and the tickets
            were read back rather than written. It is the same fact the `200`
            status carries, restated in the body so that a log line or a stored
            response records it without the status code beside it. It is NOT an
            error condition and should render exactly as a first placement.

    WagerPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Wager" }
        page: { $ref: "#/components/schemas/PageInfo" }

    # ---- Cash-out -----------------------------------------------------------

    CashOutQuote:
      type: object
      required:
        [wager_id, stake_minor, potential_payout_minor, survival_probability,
         fair_value_minor, margin_bps, margin_minor, value_minor,
         net_return_minor, pending_leg_count, quoted_at]
      additionalProperties: false
      description: |
        What the book will pay to close this wager now, and what it is charging
        to do so.

            fair_value_minor = round(potential_payout_minor x survival_probability)
            value_minor      = round(fair_value_minor x (1 - margin_bps / 10000))
            margin_minor     = fair_value_minor - value_minor

        with the rounding taken from the ticket rather than chosen fresh.

        Both halves are reported because the point of pricing off the FAIR value
        and subtracting a NAMED haircut -- rather than quoting off the offered
        price, where the same take hides inside the vig -- is that "what did the
        book charge me to close early" has an answer. Withholding `margin_minor`
        would give the number back and keep none of the benefit.
      properties:
        wager_id: { $ref: "#/components/schemas/EntityID" }
        stake_minor: { $ref: "#/components/schemas/MoneyMinor" }
        potential_payout_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: What the book owes if the ticket wins, frozen at placement.
        survival_probability:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          maximum: 1.0
          description: |
            The product of the devigged fair probabilities of the legs still
            pending, times the graded multiplier of the legs already decided.
            Devigged against the sharp reference book (ADR 0006), never derived
            from the offered price.
        fair_value_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: What the position is worth to hold, before the haircut. Not what is paid.
        margin_bps:
          type: integer
          format: int32
          minimum: 0
          maximum: 5000
          description: |
            The book's take, in basis points. 500 is 5%. A named constant in the
            service, not a number derived from prices -- which is exactly what
            makes it auditable, reviewable and alertable.
        margin_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: '`fair_value_minor` - `value_minor`. The take, in cash.'
        value_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: |
            What the customer receives. Strictly positive -- a non-positive value
            is not quoted at all, it is a `409`.
        net_return_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: '`value_minor` - `stake_minor`. Negative when closing early crystallises a loss.'
        pending_leg_count:
          type: integer
          format: int32
          minimum: 0
          description: How many legs are still ungraded. Zero means every leg is decided and the ticket is waiting on settlement rather than on a game.
        quoted_at:
          type: string
          format: date-time
          description: |
            The instant the quote was computed. There is deliberately no expiry
            beside it: an expiry would imply the book stands behind the number
            until then, and it does not. Whatever takes the cash-out re-prices
            while holding the wager row.

    CashOutRequest:
      type: object
      required: [accepted_value_minor]
      additionalProperties: false
      properties:
        accepted_value_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: |
            The `value_minor` the customer was shown and agreed to. The service
            re-prices while holding the wager row and refuses with `409
            price_moved` if the number has changed. Echoing a freshly fetched
            quote instead of the displayed one defeats the control entirely.

    PriceMove:
      type: object
      required: [scope, movement]
      additionalProperties: false
      description: |
        One number that changed between what the customer was shown and what the
        service holds now.

        `scope` says which shape the rest of the object takes, so a client
        switches once rather than sniffing for fields:

          `leg`      `selection_id`, `book_id` and the decimal/line pair
          `ticket`   the decimal pair, describing the whole ticket's price
          `cash_out` the `*_value_minor` pair

        Carried on the `409 price_moved` envelope so the client renders the
        change immediately. A client that had to re-quote to discover WHAT moved
        would be racing the next move, and would show the user a third number
        that was never the reason the request was refused.
      properties:
        scope:
          type: string
          enum: [leg, ticket, cash_out]
        selection_id:
          allOf: [{ $ref: "#/components/schemas/EntityID" }]
          nullable: true
        book_id:
          allOf: [{ $ref: "#/components/schemas/EntityID" }]
          nullable: true
        seen_decimal:
          type: number
          format: double
          nullable: true
          description: The number the customer saw, echoed from the request.
        seen_line:
          type: number
          format: double
          nullable: true
        current_decimal:
          type: number
          format: double
          nullable: true
          description: The number the service holds now, and the one to send back as `accepted_decimal` to take it.
        current_line:
          type: number
          format: double
          nullable: true
          description: The line now, and the one to send back as `accepted_line`. A line move always needs an explicit acceptance, whatever the price did.
        seen_value_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          nullable: true
          description: On a cash-out, the value the customer accepted.
        current_value_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          nullable: true
          description: On a cash-out, the value now, and the one to send back as `accepted_value_minor`.
        movement: { $ref: "#/components/schemas/PriceMovement" }
        improved:
          type: boolean
          description: |
            Whether the move is in the customer's favour: a LONGER price at an
            UNCHANGED line. It is false whenever the line moved at all, even if
            the price lengthened, because "better" is not defined across a line
            move -- which is precisely why this is reported separately from
            `movement` rather than derived from it by the client.
        accepted:
          type: boolean
          description: |
            True when the leg or ticket DID carry an acceptance and the accepted
            number is no longer current either -- the line moved twice while the
            customer was deciding. The two cases need different interfaces: the
            first shows a new number for the first time, the second says the
            number just agreed to is already gone.
