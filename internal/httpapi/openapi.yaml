# =============================================================================
# Sharpline REST API -- OpenAPI 3.0.3
# =============================================================================
#
# THIS FILE IS THE CONTRACT. It is authored by hand and the Go wire types are
# generated FROM it (`make codegen-openapi` -> internal/httpapi/gen). Spec-first,
# not code-first, and the choice is enforced rather than asserted:
#
#   1. Every response body this service writes is a struct in
#      internal/httpapi/gen. A handler that wants to add, rename or retype a
#      field cannot do it in Go -- the generated struct has no such field and the
#      package does not compile. The only way to change the wire is to change
#      this file.
#   2. `make codegen-check-openapi` regenerates into a throwaway path and fails
#      on any diff against the committed output, so the committed Go cannot
#      silently stop matching this YAML.
#   3. internal/httpapi/routes_test.go asserts that the route table the router
#      actually mounts is exactly the set of (path, method) pairs declared here.
#      A handler mounted at an undeclared path fails the test; a path declared
#      here with no handler fails it too.
#
# (1) and (2) pin the SHAPES, (3) pins the SURFACE. A spec that drifts from the
# implementation is worse than no spec, because clients trust it.
#
# WHY ONLY MODELS ARE GENERATED, NOT THE SERVER
# ---------------------------------------------
# oapi-codegen can emit a server interface and a chi/echo/gin router. It is
# configured (internal/httpapi/oapi-codegen.yaml) to emit models only, for one
# reason: every server mode drags in a runtime dependency
# (github.com/oapi-codegen/runtime, plus a third-party router) and Go 1.22's
# net/http ServeMux already does method+wildcard routing. The generated types are
# where the contract actually bites; the router is twenty lines of net/http.
#
# -----------------------------------------------------------------------------
# CONVENTIONS THAT APPLY TO EVERY OPERATION BELOW
# -----------------------------------------------------------------------------
#
# MONEY IS AN INTEGER NUMBER OF MINOR UNITS, NEVER A FLOAT, NEVER A STRING.
#   Every money field is named `*_minor` so the unit is in the name and cannot be
#   misread as major units, is `type: integer, format: int64`, and is bounded to
#   +/-9007199254740991.
#
#   That bound is 2^53-1. It is simultaneously domain.MaxSafeMoney, the CHECK
#   constraint on every money column in migrations 00005 and 00006, and
#   JavaScript's Number.MAX_SAFE_INTEGER -- so a JSON number is a LOSSLESS
#   representation for every value that can exist, and the frontend needs no
#   BigInt and no string parsing. A string ("1234") would be defensible if the
#   range were unbounded; it is not, and a string invites a client to run
#   parseFloat over it, which is the exact defect the integer bound exists to
#   prevent. CLAUDE.md section 12: "All money and stake values are integer minor
#   units. Floating point never touches a balance."
#
# ODDS ARE DECIMAL FLOATS, AND DECIMAL IS CANONICAL.
#   Phase 1 established that Decimal is the canonical representation and that
#   American and Fractional are LOSSY DISPLAY formats (odds.RenderAmerican and
#   odds.RenderFractional round; the round trip back is not the identity). So the
#   canonical value always travels: every price object carries `decimal_odds`
#   unconditionally.
#
#   `odds_format` (query parameter, default `decimal`) does not replace it. When
#   it names american or fractional the price object gains an ADDITIONAL
#   `display` string rendered server-side by internal/domain/odds. Rationale: the
#   browser toggles format on data it already holds and must never refetch a live
#   board to change a display format, so the client converts -- but pkg/client
#   consumers and curl users get the rendering for free without reimplementing
#   odds.RenderFractional's continued-fraction search. Both audiences are served
#   and neither can lose the canonical value.
#
# PAGINATION IS KEYSET (CURSOR), NEVER OFFSET.
#   `ingest` writes the events and prices tables continuously. OFFSET re-evaluates
#   the whole ordered set on every page, so a row inserted ahead of the offset
#   between page N and page N+1 pushes one row across the boundary and the reader
#   NEVER SEES IT; a row that leaves the set duplicates one. On a board that
#   changes every few seconds that is not a rare race, it is the normal case.
#
#   A keyset cursor names the last row instead of counting rows, so insertions
#   and deletions elsewhere in the set cannot shift it. Cursors are OPAQUE
#   base64url strings: the encoding is an implementation detail and clients that
#   parse one will break when it changes. Every cursor is bound to the exact
#   ordering it was minted under, and a cursor presented against a different
#   ordering or a different filter is rejected 400 rather than silently
#   producing a wrong page.
#
#   Three list endpoints have an unbounded row count and are cursored: the two
#   boards and search. The remaining lists (sports, leagues in a sport, books,
#   the market tree of one event) are bounded by the CATALOGUE, not by time or
#   traffic -- single-digit sports, tens of leagues, tens of books, tens of
#   markets on an event -- and return a single page with `next_cursor: null`.
#   They keep the same envelope so a client has one shape to handle.
#
# ERRORS HAVE ONE SHAPE, AND IT NEVER CARRIES INTERNAL DETAIL.
#   See the Error schema. `message` is written for a human and is chosen from a
#   fixed set of strings in Go; it is never an error value, never a driver
#   message, never a SQLSTATE, never a file path, and never a query. Anything a
#   caller must not see is logged with the request id and dropped from the
#   response, so an operator joins the two by `request_id`.
#
# THIS IS NOT A LICENSED SPORTSBOOK (CLAUDE.md section 0). There is no KYC, no
# geolocation, no payment processing and no custody of funds anywhere in this
# spec, and no field that implies any of them. Do not add one.
# =============================================================================

openapi: 3.0.3

info:
  title: Sharpline API
  version: "1.0.0"
  summary: Real-time sports odds, play-money wagering, and line history.
  description: |
    Sharpline is a **play-money simulation of a sportsbook**, not a licensed
    sportsbook. No real money moves through this API. There is no deposit, no
    withdrawal, no payment instrument, no identity verification and no
    geolocation gating, and there never will be.

    All balances are play money and are derived by folding a double-entry
    ledger; no balance is stored as a mutable field anywhere in the system.

    Prices originate from an odds provider (or, in development, from a
    synthetic stochastic market maker) and are normalized and priced by the
    ingest and pricer services before they reach this API. Every price object
    reports the provider instant it was observed at so a client can compute
    staleness itself rather than trusting freshness by implication.
  license:
    name: Unlicensed - portfolio project
  contact:
    name: Sharpline

servers:
  - url: /api/v1
    description: |
      The reverse proxy (deploy/proxy/Caddyfile) forwards `/api/*` to this
      service WITHOUT stripping the prefix, so the paths below are absolute
      as written under `/api/v1`. The proxy is the only published port; this
      service is never addressed directly from a browser.

tags:
  - name: catalogue
    description: Sports, leagues, books, events and markets. Public, unauthenticated.
  - name: board
    description: The live odds board. Public, unauthenticated.
  - name: history
    description: Line movement from the Timescale hypertable. Public, unauthenticated.
  - name: auth
    description: Registration, login, refresh-token rotation and logout.
  - name: account
    description: Profile, derived play-money balance, self-imposed limits, TOTP.

security:
  - {}

paths:

  # ---------------------------------------------------------------------------
  # Catalogue
  # ---------------------------------------------------------------------------

  /sports:
    get:
      tags: [catalogue]
      operationId: listSports
      summary: Every sport in the catalogue.
      description: |
        Reads Postgres (`sports`). Single page: the row count is the number of
        sports the provider covers, which is single digits.
      responses:
        "200":
          description: The sports, by display name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SportPage" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /sports/{sportSlug}/leagues:
    get:
      tags: [catalogue]
      operationId: listLeaguesInSport
      summary: The leagues under one sport.
      description: |
        Reads Postgres (`leagues`, index `leagues_sport_idx`). Single page:
        bounded by the catalogue.
      parameters:
        - $ref: "#/components/parameters/SportSlug"
      responses:
        "200":
          description: The leagues, by display name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaguePage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /books:
    get:
      tags: [catalogue]
      operationId: listBooks
      summary: Every sportsbook whose lines are ingested.
      description: |
        Reads Postgres (`books`). Single page: bounded by the catalogue.

        `kind` and `is_reference` are both returned. A quote from a book of kind
        `synthetic` is a statement about a random number generator and a client
        MUST be able to label it as such; `is_reference` names the sharp book the
        pricer devigs against, which is the baseline every EV number is relative
        to.
      responses:
        "200":
          description: The books, by display name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookPage" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # Board
  # ---------------------------------------------------------------------------

  /board:
    get:
      tags: [board]
      operationId: getBoard
      summary: The live odds board across every league.
      description: |
        Tradeable events (`scheduled`, `live`, `suspended`) starting before
        `starting_before`, soonest first, with the current best price on each
        event's main markets.

        **Where this reads from.** Events and their market tree come from
        Postgres, which is the source of truth for the catalogue. Prices come
        from the `prices` hypertable through a bounded window
        (`LatestPriceForEachBookOnSelections`), which is a `DISTINCT ON` served
        entirely by `prices_natural_key_idx`. Redis fronts that read as a
        snapshot cache; a miss falls through to Postgres and the answer is
        identical either way, because CLAUDE.md section 3 makes Redis "never
        the source of truth". A suspended market is returned with
        `status: suspended` rather than hidden, because a suspension is usually
        seconds long and dropping the row would make the board flicker.

        **Staleness.** Every price carries `observed_at` (the provider's own
        instant) and `ingested_at` (when this system received it). Their
        difference is the provider-attributable share of the staleness SLO;
        `now() - observed_at` is total staleness. The API does not editorialise
        either number.
      parameters:
        - $ref: "#/components/parameters/StartingBefore"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/OddsFormatQuery"
        - $ref: "#/components/parameters/BookFilter"
      responses:
        "200":
          description: One page of the board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /leagues/{leagueSlug}/board:
    get:
      tags: [board]
      operationId: getLeagueBoard
      summary: The live odds board for one league.
      description: |
        Identical to `/board` but scoped to a league, and served by a different
        index (`events_league_board_idx`) because a cross-league query cannot use
        an index led by `league_id`.
      parameters:
        - $ref: "#/components/parameters/LeagueSlug"
        - $ref: "#/components/parameters/StartingBefore"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/OddsFormatQuery"
        - $ref: "#/components/parameters/BookFilter"
      responses:
        "200":
          description: One page of the league's board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /events/{eventId}:
    get:
      tags: [catalogue]
      operationId: getEvent
      summary: One event with its full market tree.
      description: |
        The event detail page: the event, its league and sport breadcrumb, every
        market on it, every selection under each market, and the current price
        from every quoting book on every selection.

        Selections are returned in `domain.SelectionRole.DisplayOrder()` --
        home, draw, away, over, under, outright -- which is not the
        lexicographic order of those strings and therefore cannot be produced by
        any SQL `ORDER BY`. The API sorts them so that every client renders the
        same tree.

        Not paginated: an event's market tree is bounded by the event.
      parameters:
        - $ref: "#/components/parameters/EventID"
        - $ref: "#/components/parameters/OddsFormatQuery"
        - $ref: "#/components/parameters/BookFilter"
      responses:
        "200":
          description: The event and its markets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /markets/{marketId}/prices:
    get:
      tags: [catalogue]
      operationId: compareMarketPrices
      summary: Multi-book comparison for one market.
      description: |
        Every book's current price on every selection of one market, plus the
        best price per selection and the market's overround at each book.

        This is the endpoint behind CLAUDE.md section 6's "multi-book
        comparison". The overround is computed here rather than stored: it is a
        pure function of the quotes returned in the same response
        (`odds.Overround`), so a client can check the arithmetic, and a stored
        copy would be a second truth able to disagree with the prices beside it.

        Not paginated: bounded by (selections on a market) x (books ingested).
      parameters:
        - $ref: "#/components/parameters/MarketID"
        - $ref: "#/components/parameters/OddsFormatQuery"
        - $ref: "#/components/parameters/BookFilter"
      responses:
        "200":
          description: The comparison grid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketComparison" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # History
  # ---------------------------------------------------------------------------

  /selections/{selectionId}/history:
    get:
      tags: [history]
      operationId: getSelectionHistory
      summary: Line movement for one selection at one book.
      description: |
        The reason the `prices` hypertable exists. Returns every quote one book
        made on one selection inside a half-open window `[from, to)`, oldest
        first, optionally downsampled.

        **The window is REQUIRED and is not a convenience.** `prices` is
        partitioned on `observed_at` in 12-hour chunks and migration 00004
        installs no retention policy, so the chunk count grows for the life of
        the deployment. A read with no lower bound defeats chunk exclusion and
        makes the planner consult an index on every chunk that has ever existed.
        There is deliberately no unbounded variant to reach for by accident.
        `to` defaults to now; `from` has no default and must be supplied.

        **Downsampling.** `resolution` selects a Timescale `time_bucket` width.
        `raw` returns every stored quote and is what a five-minute window wants;
        anything longer wants a bucket, because a market quoted every two seconds
        for a week is 300k points and no chart can draw them. A bucketed point
        reports `open`, `high`, `low`, `close` and `samples` for the bucket
        rather than a mean: the mean of a line is not a line anyone traded at,
        and open/close is what CLV and steam detection are computed from.

        `max_points` is a guard, not a page size -- a request whose window and
        resolution would exceed it is rejected `422` with the resolution that
        would fit, rather than being silently truncated into a chart that lies
        about where the line ended.
      parameters:
        - $ref: "#/components/parameters/SelectionID"
        - name: book
          in: query
          required: true
          description: |
            The book whose quotes to return, by slug. Required: a chart mixing
            two books' quotes on one series is not a line movement chart, it is
            two of them overlaid, and the caller must say which it wants.
          schema: { $ref: "#/components/schemas/Slug" }
        - name: from
          in: query
          required: true
          description: Inclusive lower bound on `observed_at` (RFC 3339).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: |
            Exclusive upper bound on `observed_at` (RFC 3339). Defaults to the
            time the request is served. Half-open so adjacent windows tile
            without double-counting the boundary quote.
          schema: { type: string, format: date-time }
        - name: resolution
          in: query
          required: false
          description: |
            Downsampling bucket width. `raw` returns stored quotes unaggregated.
          schema: { $ref: "#/components/schemas/HistoryResolution" }
        - name: max_points
          in: query
          required: false
          description: Reject (422) rather than truncate if the window would exceed this many points.
          schema: { type: integer, format: int32, minimum: 1, maximum: 5000, default: 1000 }
        - $ref: "#/components/parameters/OddsFormatQuery"
      responses:
        "200":
          description: The line movement series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistorySeries" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # Search
  # ---------------------------------------------------------------------------

  /search:
    get:
      tags: [catalogue]
      operationId: searchEvents
      summary: Find tradeable events by competitor name prefix.
      description: |
        Case-insensitive PREFIX match on either competitor's name, served by two
        partial expression indexes (`events_{home,away}_competitor_search_idx`,
        both `lower(col) text_pattern_ops`). Infix search would need a GIN
        trigram index and the `pg_trgm` extension, which migration 00002
        deliberately does not create; a type-ahead box wants prefix matching
        anyway.

        The status set here is NARROWER than the board's: `scheduled` and `live`
        only, which is exactly `domain.EventStatus.AcceptsWagers()`. The board
        shows a suspended event greyed out because a suspension is seconds long;
        this endpoint answers "what can I bet on", and a suspended market cannot
        be bet on. The accepted consequence is that an event is unfindable during
        a suspension.
      parameters:
        - name: q
          in: query
          required: true
          description: |
            Competitor name prefix. Matched literally -- `%` and `_` are escaped
            before the query, so a caller cannot turn a prefix search into a
            leading-wildcard scan.
          schema: { type: string, minLength: 2, maxLength: 64 }
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account.
      description: |
        Email and password only. There is no name, no address, no date of birth
        and no identity document, because CLAUDE.md section 0 rules out KYC
        entirely and migration 00005 has no column to put any of them in.

        The password is hashed with argon2id and the full PHC parameter string is
        stored, so the cost can be raised later and rehashed per user on their
        next successful login without a migration.

        A play-money grant is NOT issued here. Money enters a balance only
        through a double-entry ledger transaction, which is phase 8.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: The account was created and a session was opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: |
            An account already exists for that address.

            This endpoint DOES leak the existence of an address, and that is a
            deliberate, bounded trade: a registration form that accepts a
            duplicate silently is unusable, and the same fact is obtainable from
            any password-reset flow. `/auth/login` leaks nothing (see there).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for an access token and a refresh token.
      description: |
        **This endpoint does not enumerate users.** An unknown address and a
        wrong password produce byte-identical responses, the same status code,
        and the same timing: the handler runs a full argon2id verification
        against a fixed decoy hash when no user is found, so the expensive path
        is taken either way.

        If the account has a confirmed TOTP enrolment, a first call without
        `totp_code` returns `401` with `code: totp_required`. That response is
        only reachable AFTER the password has been verified, so it discloses
        nothing to someone who does not already hold the password.

        On success a new refresh-token FAMILY is started. The refresh token is
        returned once, in this response body, and never again; only its SHA-256
        reaches the database.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Credentials rejected, or a second factor is required. Indistinguishable
            between "no such account" and "wrong password".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            The account exists and the credentials are correct, but its status
            forbids a session -- `suspended`, `self_excluded` or `closed`. A
            self-excluded account cannot be logged into, which is the point of
            self-exclusion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate a refresh token for a new access token.
      description: |
        Redeeming a refresh token invalidates it and issues its successor, in one
        transaction. At any instant a family has exactly one live token.

        **Reuse detection.** Presenting a token that has already been redeemed
        means either an attacker is replaying a stolen token or the legitimate
        client is replaying one whose successor was stolen. The two are
        indistinguishable, so the only safe response is to revoke the ENTIRE
        family -- every descendant of the original login -- with reason
        `reuse_detected`, and force a fresh password authentication. The
        response is `401`, identical to the response for an unknown token: a
        thief must not learn from the status code that they tripped a detector.

        The detection is structural, not a read-then-write: a partial unique
        index (`refresh_tokens_one_successor`) permits at most one child per
        token, so two concurrent redemptions of the same token cannot both mint
        a successor whatever the application believed it read.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Rotated. The previous refresh token is now dead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Unknown, expired, revoked or already-redeemed token. All four are
            reported identically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the presented refresh token's entire family.
      description: |
        Revokes the family with reason `logout`, which ends every session
        descended from that login. Idempotent: logging out an already-revoked or
        unknown family returns `204`, because reporting "that token was already
        dead" is an enumeration oracle and there is nothing a caller can do with
        the distinction.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204":
          description: The family is revoked (or was already).
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # Account
  # ---------------------------------------------------------------------------

  /account:
    get:
      tags: [account]
      operationId: getAccount
      summary: The authenticated user's profile.
      description: |
        Email, status, when the account was created, and whether a TOTP second
        factor is enrolled and confirmed.

        There is nothing else, because migration 00005 stores nothing else: no
        legal name, no address, no date of birth, no document, no country, no
        jurisdiction. Their absence is a design decision recorded in that
        migration, not an unimplemented field.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /account/balance:
    get:
      tags: [account]
      operationId: getBalance
      summary: The authenticated user's derived play-money balance.
      description: |
        **The balance is DERIVED, never stored.** It is `sum(amount_minor)` over
        the user's ledger entries, read through the `account_balances` view.
        There is no balance column anywhere in the schema and migration 00006
        makes that a structural fact rather than a convention: a stored balance
        can be stale, and a bet slip validated against a stale balance is an
        overdraft.

        Two accounts are reported. `cash` is spendable; `escrow` holds the stakes
        of open wagers, which have left the spendable balance but have not yet
        been won or lost. Their sum is the user's total position.

        A user with no ledger movement yet returns zero balances with
        `entry_count: 0` -- correctly, and without inventing a grant. "This
        account was touched and nets to nothing" and "this account has never been
        touched" are different facts, and `entry_count` is what distinguishes
        them.

        If this fold ever becomes too slow the answer is a MATERIALISED VIEW
        refreshed from the ledger, never a mutable column on `users`: a
        materialised view can be provably rebuilt from the entries, a column
        cannot.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The derived balances.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /account/limits:
    get:
      tags: [account]
      operationId: listLimits
      summary: The self-imposed limits currently in force.
      description: |
        Responsible-gaming-style self-imposed limits (CLAUDE.md section 6). The
        current limit for a `(kind, period)` pair is the one row with no
        `superseded_at`; superseded rows are history and are not returned here.

        There is no `deposit` limit and there will not be one: this system has no
        deposits. The play-money analogue is `grant`, which binds to the ledger
        entry kind of the same name -- the only way money enters a balance.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The limits in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [account]
      operationId: setLimit
      summary: Set or change a self-imposed limit.
      description: |
        **Tightening binds immediately. Loosening serves a cooling-off period.**
        That asymmetry is the entire point of the control: a limit a user can
        lift the instant they want to is not a limit. A request that lowers a
        money limit, shortens a session limit, or introduces a limit where there
        was none takes effect at `requested_at`; a request that raises or removes
        one takes effect after the cooling-off period and the response reports
        the `effective_from` instant so the user can see when.

        Rows are append-only history, never edited: the previous row is closed
        with `superseded_at` and a new one is written. "What limit was in force
        when this wager was accepted" must remain answerable, and an operator
        must not be able to make a customer's limit history disappear -- the
        database refuses both an UPDATE of the substantive columns and a DELETE.

        Audited: writes `user_limit.set` to the audit log with the before and
        after state.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetLimitRequest" }
      responses:
        "201":
          description: The limit was recorded. Check `effective_from`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: A concurrent request already superseded the limit this one was based on. Retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /account/totp:
    post:
      tags: [account]
      operationId: beginTOTPEnrolment
      summary: Begin TOTP enrolment.
      description: |
        Mints a shared secret, stores it as AEAD ciphertext under a key held
        outside the database, and returns the provisioning URI ONCE. The secret
        is not retrievable afterwards; a lost enrolment is restarted, not
        recovered.

        The enrolment is NOT active until `/account/totp/confirm` proves a code
        from it. An unconfirmed row must never be treated as an enrolled second
        factor -- otherwise a mis-scanned QR code locks the account out.

        Audited: `totp.enrol_begin`. The provisioning URI is never logged.
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Enrolment started. Store the URI now; it is not returned again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPEnrolment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: A confirmed enrolment already exists. Remove it first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [account]
      operationId: removeTOTP
      summary: Remove the TOTP second factor.
      description: |
        Requires a currently-valid code from the factor being removed, so that a
        stolen access token alone cannot strip the second factor.

        Audited: `totp.remove`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPCodeRequest" }
      responses:
        "204":
          description: Removed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No enrolment to remove.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /account/totp/confirm:
    post:
      tags: [account]
      operationId: confirmTOTPEnrolment
      summary: Prove a code and activate the TOTP second factor.
      description: |
        Audited: `totp.enrol_confirm`. The code is never logged.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPCodeRequest" }
      responses:
        "200":
          description: Confirmed. The factor is now required at login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No enrolment in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A short-lived JWT access token from `/auth/login` or `/auth/refresh`.

        The verifier PINS the signing algorithm and ignores the `alg` header on
        the presented token, so `alg: none` and an algorithm-confusion downgrade
        are both unrepresentable rather than merely rejected. Issuer, audience
        and expiry are all verified. Lifetime is minutes; durable session length
        comes from refresh-token rotation, not from a long-lived access token.

  parameters:

    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows in this page.
      schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 50 }

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque continuation token from a previous response's `page.next_cursor`.
        Do not construct or parse one. A cursor is bound to the ordering and the
        filters it was minted under and is rejected `400` if presented with
        different ones.
      schema: { type: string, maxLength: 512 }

    OddsFormatQuery:
      name: odds_format
      in: query
      required: false
      description: |
        Adds a rendered `display` string to every price. `decimal_odds` is always
        present regardless, because it is the canonical value and the other two
        formats are lossy.
      schema: { $ref: "#/components/schemas/OddsFormat" }

    BookFilter:
      name: book
      in: query
      required: false
      description: |
        Restrict prices to these books, by slug. Repeatable. Omitted means every
        book. An unknown slug is a `400`, not a silent empty result -- a typo
        that quietly returns nothing is the worst possible outcome for a price
        comparison.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 32
        items: { $ref: "#/components/schemas/Slug" }

    StartingBefore:
      name: starting_before
      in: query
      required: false
      description: |
        Upper bound on `scheduled_start` (RFC 3339). Defaults to 24 hours from
        the time the request is served, which is "today's board".
      schema: { type: string, format: date-time }

    SportSlug:
      name: sportSlug
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Slug" }

    LeagueSlug:
      name: leagueSlug
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Slug" }

    EventID:
      name: eventId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EntityID" }

    MarketID:
      name: marketId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EntityID" }

    SelectionID:
      name: selectionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EntityID" }

  responses:

    BadRequest:
      description: The request was malformed -- a bad parameter, an unparseable body, an unknown book slug, an undecodable cursor.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Unauthorized:
      description: No access token, or one that failed verification.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: '`Bearer` with an error code, per RFC 6750.'

    NotFound:
      description: No such entity. Never used to signal an authorization failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    UnprocessableEntity:
      description: |
        Syntactically valid but semantically impossible -- a `from` after its
        `to`, a window and resolution that exceed `max_points`, a session limit
        denominated in money.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    TooManyRequests:
      description: |
        Rate limited. Limits are enforced per authenticated user AND per client
        IP, in Redis, so they hold across every replica rather than per pod.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      headers:
        Retry-After:
          schema: { type: integer, format: int32 }
          description: Seconds to wait before retrying.
        RateLimit-Remaining:
          schema: { type: integer, format: int32 }
        RateLimit-Reset:
          schema: { type: integer, format: int32 }

    InternalError:
      description: |
        Something failed inside the service. The response carries a `request_id`
        and nothing else; the cause is in the logs and the trace under that id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:

    # -------------------------------------------------------------------------
    # Primitives
    # -------------------------------------------------------------------------

    EntityID:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._-]+$'
      description: |
        A domain identifier. The charset is exactly `domain.validID`: `:` is
        excluded because WebSocket channels are `event:{id}` and a colon inside
        an identifier would make splitting a channel name ambiguous.
      example: "evt_nfl_2026_w1_kc_buf"

    Slug:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9_-]*$'
      example: "nfl"

    EmailAddress:
      type: string
      minLength: 3
      maxLength: 254
      pattern: '^[^\\s@]+@[^\\s@]+$'
      description: |
        An email address.

        The pattern is EXACTLY the database's `users_email_shape` CHECK -- one
        `@` with non-empty, whitespace-free sides -- and no tighter. Stricter
        regexes reject deliverable addresses (quoted local parts, single-label
        domains) and the only real proof an address exists is sending mail to it.

        Deliberately NOT `format: email`. That format makes oapi-codegen emit
        `openapi_types.Email`, which drags github.com/oapi-codegen/runtime into a
        module whose serving path otherwise has no third-party dependency at all,
        in exchange for a type alias over `string` that validates nothing at
        runtime. The pattern above is the validation, it is the same one the
        database enforces, and it costs nothing.

        Stored lowercase-normalised; the database CHECK makes that an invariant
        rather than a convention, so a plain unique index is a correct
        case-insensitive uniqueness constraint.
      example: "sharp@example.test"

    MoneyMinor:
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: |
        An amount in MINOR UNITS (cents), as an integer. Never a float, never a
        string. The bound is 2^53-1, which is both the largest integer a float64
        holds exactly and JavaScript's `Number.MAX_SAFE_INTEGER`, and is the same
        bound the database CHECK constraints enforce -- so a JSON number is
        lossless for every value that can exist.
      example: 250000

    DecimalOdds:
      type: number
      format: double
      exclusiveMinimum: true
      minimum: 1.0
      maximum: 100000.0
      description: |
        Decimal odds -- the total return per unit staked, stake included. THE
        CANONICAL representation. American and fractional are derived and lossy.
      example: 1.909

    Probability:
      type: number
      format: double
      minimum: 0.0
      maximum: 1.0

    OddsFormat:
      type: string
      enum: [decimal, american, fractional]
      default: decimal

    HistoryResolution:
      type: string
      enum: [raw, 10s, 1m, 5m, 15m, 1h, 6h, 1d]
      default: raw

    EventStatus:
      type: string
      description: |
        Exactly `domain.EventStatus`, same spelling, same members. The API does
        not get to invent a status the domain cannot represent, and the domain
        does not get to add one without changing this list.
      enum: [scheduled, live, suspended, ended, settled, postponed, cancelled]

    MarketStatus:
      type: string
      description: Exactly `domain.MarketStatus`.
      enum: [open, suspended, closed, settled, voided]

    MarketType:
      type: string
      description: Exactly `domain.MarketType`.
      enum: [moneyline, spread, total, player_prop, futures]

    EventKind:
      type: string
      description: |
        Exactly `domain.EventKind`. `match` is a contest between two competitors;
        `outright` is a competition resolved among many runners and has no home
        or away side at all -- not empty ones.
      enum: [match, outright]

    SelectionRole:
      type: string
      description: Exactly `domain.SelectionRole`.
      enum: [home, draw, away, over, under, outright]

    BookKind:
      type: string
      description: |
        Exactly `domain.BookKind`. `synthetic` is the in-house stochastic market
        maker: a quote from it is a statement about a random number generator and
        every surface that renders one must be able to label it as such.
      enum: [external, synthetic]

    AccountStatus:
      type: string
      enum: [active, suspended, self_excluded, closed]

    LimitKind:
      type: string
      enum: [grant, stake, loss, session]
      description: |
        Deliberately NOT `deposit`: this system has no deposits (CLAUDE.md
        section 0). `grant`, `stake` and `loss` are spelled identically to the
        ledger entry kinds they are evaluated against, so enforcing a limit is a
        sum filtered by the same string with no translation table in between.

    LimitPeriod:
      type: string
      enum: [day, week, month, session]

    # -------------------------------------------------------------------------
    # Errors
    # -------------------------------------------------------------------------

    Error:
      type: object
      required: [code, message, request_id]
      additionalProperties: false
      description: |
        THE ONE ERROR SHAPE. Every non-2xx response in this API has exactly this
        body, so a client writes one decoder and one branch.

        `code` is a stable machine-readable token and is what a client should
        switch on; the HTTP status is a coarser classification of the same fact.
        `message` is a fixed human-readable string chosen from a closed set in
        Go. It is NEVER an error value, a driver message, a SQLSTATE, a stack
        frame, a file path or a query -- an error body is an untrusted output
        surface and everything a caller must not learn is logged under
        `request_id` and dropped here.

        `invalid_params` is present only for `400` and `422` and names the
        offending parameters so a form can highlight them. Its `reason` strings
        are equally fixed.
      properties:
        code:
          type: string
          enum:
            - bad_request
            - invalid_parameter
            - invalid_cursor
            - unauthenticated
            - invalid_credentials
            - totp_required
            - invalid_totp_code
            - forbidden
            - account_not_active
            - not_found
            - conflict
            - already_exists
            - unprocessable
            - rate_limited
            - internal
        message:
          type: string
          maxLength: 200
        request_id:
          type: string
          maxLength: 64
          description: |
            Correlates this response with the server log line and the trace span
            that produced it. Quote it in a bug report; it is the only handle on
            what actually happened.
        invalid_params:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/InvalidParam" }

    InvalidParam:
      type: object
      required: [name, reason]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
          description: The query parameter, path parameter or JSON pointer at fault.
        reason:
          type: string
          maxLength: 200

    # -------------------------------------------------------------------------
    # Pagination
    # -------------------------------------------------------------------------

    PageInfo:
      type: object
      required: [limit, has_more]
      additionalProperties: false
      description: |
        Keyset pagination. There is no total count and there will not be one:
        counting an unbounded, continuously-written set costs a full scan on
        every page and the number is stale before it is serialised.
      properties:
        limit:
          type: integer
          format: int32
          description: The page size actually applied, which may be smaller than the one requested.
        has_more:
          type: boolean
        next_cursor:
          type: string
          maxLength: 512
          nullable: true
          description: |
            Pass back as `cursor` for the next page. `null` when `has_more` is
            false. Opaque -- do not parse it.

    # -------------------------------------------------------------------------
    # Catalogue
    # -------------------------------------------------------------------------

    Sport:
      type: object
      required: [id, slug, name]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 200 }

    SportPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Sport" }
        page: { $ref: "#/components/schemas/PageInfo" }

    League:
      type: object
      required: [id, sport_id, slug, name]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        sport_id: { $ref: "#/components/schemas/EntityID" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 200 }

    LeaguePage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/League" }
        page: { $ref: "#/components/schemas/PageInfo" }

    Book:
      type: object
      required: [id, slug, name, kind, is_reference]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 200 }
        kind: { $ref: "#/components/schemas/BookKind" }
        is_reference:
          type: boolean
          description: |
            The sharp book the pricer devigs against to produce fair value. Every
            EV number in this system is relative to this book, so a client that
            renders EV must be able to name it.

    BookPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        page: { $ref: "#/components/schemas/PageInfo" }

    GameClock:
      type: object
      required: [running]
      additionalProperties: false
      description: Live clock state. Absent entirely on an event that has not started.
      properties:
        period: { type: integer, format: int32, nullable: true }
        elapsed_seconds: { type: integer, format: int64, nullable: true }
        running: { type: boolean }

    Score:
      type: object
      required: [home, away]
      additionalProperties: false
      properties:
        home: { type: integer, format: int32 }
        away: { type: integer, format: int32 }

    EventSummary:
      type: object
      required: [id, league_id, kind, name, scheduled_start, status, observed_at]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        league_id: { $ref: "#/components/schemas/EntityID" }
        kind: { $ref: "#/components/schemas/EventKind" }
        name: { type: string, maxLength: 200 }
        home_competitor: { $ref: "#/components/schemas/Competitor" }
        away_competitor: { $ref: "#/components/schemas/Competitor" }
        scheduled_start: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/EventStatus" }
        clock: { $ref: "#/components/schemas/GameClock" }
        score: { $ref: "#/components/schemas/Score" }
        observed_at:
          type: string
          format: date-time
          description: The provider instant this event's state was observed at.

    Competitor:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        name: { type: string, maxLength: 200 }

    Selection:
      type: object
      required: [id, market_id, role, name, prices]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        market_id: { $ref: "#/components/schemas/EntityID" }
        role: { $ref: "#/components/schemas/SelectionRole" }
        name: { type: string, maxLength: 200 }
        prices:
          type: array
          description: |
            The current price at each quoting book, ordered by book slug. Empty
            when no book has quoted this selection inside the freshness window --
            which is a correct answer, not a missing one.
          items: { $ref: "#/components/schemas/Price" }
        best_price:
          $ref: "#/components/schemas/Price"

    Price:
      type: object
      required: [book_id, book_slug, decimal_odds, implied_probability, observed_at, ingested_at]
      additionalProperties: false
      properties:
        book_id: { $ref: "#/components/schemas/EntityID" }
        book_slug: { $ref: "#/components/schemas/Slug" }
        decimal_odds: { $ref: "#/components/schemas/DecimalOdds" }
        implied_probability:
          allOf: [{ $ref: "#/components/schemas/Probability" }]
          description: |
            `1/decimal_odds`. WITH the book's vig still in it -- this is not a
            fair probability and must not be labelled as one in a UI. Returned
            because it is what a price cell's width or a bar chart is drawn from,
            and computing it client-side is one more place to get the reciprocal
            wrong.
        display:
          type: string
          maxLength: 32
          description: |
            The price rendered in the requested `odds_format`. Present only when
            `odds_format` is `american` or `fractional`; `decimal_odds` above is
            always authoritative.
        line:
          type: number
          format: double
          nullable: true
          description: The handicap or total this price was quoted at, when the market carries one.
        observed_at:
          type: string
          format: date-time
          description: The provider's own instant. The subtrahend in the staleness SLO.
        ingested_at:
          type: string
          format: date-time
          description: When this system received it. `ingested_at - observed_at` is the provider-attributable share of staleness.

    Market:
      type: object
      required: [id, event_id, type, status, observed_at, selections]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        event_id: { $ref: "#/components/schemas/EntityID" }
        type: { $ref: "#/components/schemas/MarketType" }
        line:
          type: number
          format: double
          nullable: true
        subject:
          type: string
          maxLength: 200
          nullable: true
          description: The player a prop market is about. Null on every other market type.
        status: { $ref: "#/components/schemas/MarketStatus" }
        observed_at: { type: string, format: date-time }
        selections:
          type: array
          items: { $ref: "#/components/schemas/Selection" }

    BoardEntry:
      type: object
      required: [event, markets]
      additionalProperties: false
      properties:
        event: { $ref: "#/components/schemas/EventSummary" }
        markets:
          type: array
          description: The event's markets with their selections and current prices.
          items: { $ref: "#/components/schemas/Market" }

    BoardPage:
      type: object
      required: [data, page, as_of]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/BoardEntry" }
        page: { $ref: "#/components/schemas/PageInfo" }
        as_of:
          type: string
          format: date-time
          description: |
            When this page was assembled. A client computes staleness against
            this rather than against its own clock, so a skewed browser clock
            cannot make a fresh board look stale.

    EventDetail:
      type: object
      required: [event, league, sport, markets, as_of]
      additionalProperties: false
      properties:
        event: { $ref: "#/components/schemas/EventSummary" }
        league: { $ref: "#/components/schemas/League" }
        sport: { $ref: "#/components/schemas/Sport" }
        markets:
          type: array
          items: { $ref: "#/components/schemas/Market" }
        as_of: { type: string, format: date-time }

    SearchHit:
      type: object
      required: [id, league_id, kind, name, scheduled_start, status]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        league_id: { $ref: "#/components/schemas/EntityID" }
        kind: { $ref: "#/components/schemas/EventKind" }
        name: { type: string, maxLength: 200 }
        home_competitor_name: { type: string, maxLength: 200, nullable: true }
        away_competitor_name: { type: string, maxLength: 200, nullable: true }
        scheduled_start: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/EventStatus" }

    SearchPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
        page: { $ref: "#/components/schemas/PageInfo" }

    # -------------------------------------------------------------------------
    # Multi-book comparison
    # -------------------------------------------------------------------------

    BookQuote:
      type: object
      required: [book_id, book_slug, book_name, book_kind, is_reference, quotes]
      additionalProperties: false
      properties:
        book_id: { $ref: "#/components/schemas/EntityID" }
        book_slug: { $ref: "#/components/schemas/Slug" }
        book_name: { type: string, maxLength: 200 }
        book_kind: { $ref: "#/components/schemas/BookKind" }
        is_reference: { type: boolean }
        overround:
          type: number
          format: double
          nullable: true
          description: |
            `sum(1/decimal_odds) - 1` over this book's quotes on the market --
            the book's margin. Null when the book has not quoted every selection,
            because an overround computed over a partial market is not a margin,
            it is a smaller number that looks like a better price.
        quotes:
          type: array
          items: { $ref: "#/components/schemas/SelectionQuote" }

    SelectionQuote:
      type: object
      required: [selection_id, role, decimal_odds, implied_probability, observed_at, ingested_at]
      additionalProperties: false
      properties:
        selection_id: { $ref: "#/components/schemas/EntityID" }
        role: { $ref: "#/components/schemas/SelectionRole" }
        decimal_odds: { $ref: "#/components/schemas/DecimalOdds" }
        implied_probability: { $ref: "#/components/schemas/Probability" }
        display: { type: string, maxLength: 32 }
        line: { type: number, format: double, nullable: true }
        observed_at: { type: string, format: date-time }
        ingested_at: { type: string, format: date-time }

    MarketComparison:
      type: object
      required: [market, books, best, as_of]
      additionalProperties: false
      properties:
        market:
          $ref: "#/components/schemas/MarketHeader"
        books:
          type: array
          description: Every book quoting this market, ordered by slug.
          items: { $ref: "#/components/schemas/BookQuote" }
        best:
          type: array
          description: |
            The best available price on each selection, and where it is. This is
            the input to arbitrage detection and it is computed here rather than
            left to the client so that "best" means one thing across every
            surface.
          items: { $ref: "#/components/schemas/BestPrice" }
        as_of: { type: string, format: date-time }

    MarketHeader:
      type: object
      required: [id, event_id, type, status, observed_at]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        event_id: { $ref: "#/components/schemas/EntityID" }
        type: { $ref: "#/components/schemas/MarketType" }
        line: { type: number, format: double, nullable: true }
        subject: { type: string, maxLength: 200, nullable: true }
        status: { $ref: "#/components/schemas/MarketStatus" }
        observed_at: { type: string, format: date-time }

    BestPrice:
      type: object
      required: [selection_id, role, book_id, book_slug, decimal_odds, observed_at]
      additionalProperties: false
      properties:
        selection_id: { $ref: "#/components/schemas/EntityID" }
        role: { $ref: "#/components/schemas/SelectionRole" }
        book_id: { $ref: "#/components/schemas/EntityID" }
        book_slug: { $ref: "#/components/schemas/Slug" }
        decimal_odds: { $ref: "#/components/schemas/DecimalOdds" }
        display: { type: string, maxLength: 32 }
        observed_at: { type: string, format: date-time }

    # -------------------------------------------------------------------------
    # History
    # -------------------------------------------------------------------------

    HistorySeries:
      type: object
      required: [selection_id, book_id, book_slug, resolution, from, to, points]
      additionalProperties: false
      properties:
        selection_id: { $ref: "#/components/schemas/EntityID" }
        book_id: { $ref: "#/components/schemas/EntityID" }
        book_slug: { $ref: "#/components/schemas/Slug" }
        resolution:
          allOf: [{ $ref: "#/components/schemas/HistoryResolution" }]
          description: The resolution actually applied. Equal to the one requested, or `raw` if none was.
        from: { type: string, format: date-time, description: Inclusive. }
        to: { type: string, format: date-time, description: Exclusive. }
        points:
          type: array
          items: { $ref: "#/components/schemas/HistoryPoint" }

    HistoryPoint:
      type: object
      required: [at, open, high, low, close, samples]
      additionalProperties: false
      description: |
        One point of a line-movement series. On `resolution: raw` every field but
        `samples` holds the same stored quote and `samples` is 1, so a client
        renders one shape whether or not it asked for downsampling.

        Open/high/low/close rather than a mean: the mean of a line is a price
        nobody traded at, and CLV and steam detection are both computed from the
        endpoints of a window, not from its average.
      properties:
        at:
          type: string
          format: date-time
          description: "The bucket's start instant (`raw`: the quote's `observed_at`)."
        open: { $ref: "#/components/schemas/DecimalOdds" }
        high: { $ref: "#/components/schemas/DecimalOdds" }
        low: { $ref: "#/components/schemas/DecimalOdds" }
        close: { $ref: "#/components/schemas/DecimalOdds" }
        close_display: { type: string, maxLength: 32 }
        line: { type: number, format: double, nullable: true, description: The line at the bucket's close. }
        samples: { type: integer, format: int32, minimum: 1 }

    # -------------------------------------------------------------------------
    # Auth
    # -------------------------------------------------------------------------

    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          allOf: [{ $ref: "#/components/schemas/EmailAddress" }]
          description: Normalised to lowercase before storage; the database CHECK makes that an invariant, not a convention.
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: |
            Minimum 12 characters and no composition rules. Length beats
            character-class requirements, which push users toward `Password1!`
            and toward reuse. Hashed with argon2id; never logged, never traced,
            never echoed.

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { $ref: "#/components/schemas/EmailAddress" }
        password: { type: string, maxLength: 256 }
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Required only if the account has a confirmed TOTP enrolment.

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 16
          maxLength: 512
          description: |
            The opaque refresh token from a previous session response. At least
            256 bits of `crypto/rand`; only its SHA-256 is stored, so a database
            leak yields no working tokens.

    SessionResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_at, account]
      additionalProperties: false
      description: |
        Returned by register, login and refresh. Both tokens are returned in the
        BODY and never set as cookies: this API is consumed cross-origin through
        a proxy by a Next.js client and by `pkg/client`, and a cookie-bearing
        API is a CSRF surface that would have to be defended with a second
        mechanism. The client stores the refresh token; the access token is held
        in memory.

        **The refresh token is shown exactly once.** It is not retrievable
        afterwards and it does not appear in any log, span or metric.
      properties:
        access_token:
          type: string
          description: "Short-lived JWT. Present it as `Authorization: Bearer <token>`."
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          format: int32
          description: Access-token lifetime in seconds. Minutes, not hours.
        refresh_token:
          type: string
          description: Opaque. Rotates on every use; reuse revokes the whole family.
        refresh_expires_at:
          type: string
          format: date-time
          description: |
            Absolute end of the login lineage, measured from when the family
            STARTED, not from this token's issue. Without that, a session
            rotated every ten minutes would live forever.
        account: { $ref: "#/components/schemas/Account" }

    # -------------------------------------------------------------------------
    # Account
    # -------------------------------------------------------------------------

    Account:
      type: object
      required: [id, email, status, totp_enrolled, created_at]
      additionalProperties: false
      description: |
        The whole profile. There is no name, address, date of birth, document,
        country or jurisdiction field, because this is not a licensed sportsbook
        and no such column exists (migration 00005). Their absence is deliberate.
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        email: { $ref: "#/components/schemas/EmailAddress" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        totp_enrolled:
          type: boolean
          description: True only for a CONFIRMED enrolment. An unconfirmed one is not a second factor.
        created_at: { type: string, format: date-time }

    AccountBalance:
      type: object
      required: [account_kind, balance_minor, entry_count]
      additionalProperties: false
      properties:
        account_kind: { type: string, enum: [user_cash, user_escrow] }
        balance_minor: { $ref: "#/components/schemas/MoneyMinor" }
        entry_count:
          type: integer
          format: int64
          description: |
            Ledger entries folded to produce this balance. Zero means the account
            has never moved -- a different fact from "moved and nets to zero",
            and the only thing that distinguishes them.

    BalanceResponse:
      type: object
      required: [currency, minor_units_per_major, cash, escrow, total_minor, as_of]
      additionalProperties: false
      properties:
        currency:
          type: string
          enum: [PLAY]
          description: |
            Not a real currency and deliberately not an ISO 4217 code. Labelling
            play money `USD` is the first step toward a client treating it as
            money, which CLAUDE.md section 0 forbids.
        minor_units_per_major:
          type: integer
          format: int32
          enum: [100]
          description: Divide by this only for DISPLAY. Never do arithmetic in major units.
        cash: { $ref: "#/components/schemas/AccountBalance" }
        escrow: { $ref: "#/components/schemas/AccountBalance" }
        total_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          description: cash + escrow. The user's total position.
        as_of: { type: string, format: date-time }

    Limit:
      type: object
      required: [id, kind, period, requested_at, effective_from, in_force]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EntityID" }
        kind: { $ref: "#/components/schemas/LimitKind" }
        period: { $ref: "#/components/schemas/LimitPeriod" }
        amount_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          nullable: true
          description: Set on money kinds (`grant`, `stake`, `loss`); null on `session`.
        duration_seconds:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 86400
          description: Set on `session` only; null on money kinds.
        requested_at: { type: string, format: date-time }
        effective_from:
          type: string
          format: date-time
          description: |
            Equal to `requested_at` for a tightening. Later for a loosening
            serving its cooling-off period.
        in_force:
          type: boolean
          description: Whether `effective_from` has passed. A pending loosening is returned with `false`.

    LimitPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Limit" }
        page: { $ref: "#/components/schemas/PageInfo" }

    SetLimitRequest:
      type: object
      required: [kind, period]
      additionalProperties: false
      description: |
        Exactly one of `amount_minor` and `duration_seconds` must be present, and
        which one is determined by `kind`: `session` takes a duration, every
        other kind takes an amount. The database enforces the same biconditional,
        so an impossible combination is unstorable as well as rejected.

        Omitting both REMOVES the limit, which is a loosening and serves the
        cooling-off period like any other.
      properties:
        kind: { $ref: "#/components/schemas/LimitKind" }
        period: { $ref: "#/components/schemas/LimitPeriod" }
        amount_minor:
          allOf: [{ $ref: "#/components/schemas/MoneyMinor" }]
          nullable: true
        duration_seconds:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 86400

    TOTPEnrolment:
      type: object
      required: [provisioning_uri, expires_at]
      additionalProperties: false
      description: |
        Returned ONCE. The shared secret is never retrievable afterwards and is
        stored only as AEAD ciphertext under a key held outside the database,
        with the user id as additional authenticated data so a row copied between
        users fails to decrypt rather than silently granting the attacker's
        device the victim's second factor.
      properties:
        provisioning_uri:
          type: string
          description: |
            `otpauth://totp/...`. CREDENTIAL MATERIAL -- it embeds the shared
            secret. Never logged, never traced, never persisted by a client
            beyond the moment the user scans it.
        expires_at:
          type: string
          format: date-time
          description: An unconfirmed enrolment expires. A stale one must not linger as a half-enrolled factor.

    TOTPCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Compared in constant time against the expected code for the current and adjacent time steps.
