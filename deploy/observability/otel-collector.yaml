# Sharpline — OpenTelemetry Collector (contrib) configuration
#
# CLAUDE.md §9 "Observability":
#   "OpenTelemetry traces spanning ingest -> pricer -> stream so a single odds
#    update can be followed end to end."
#
# Role of this collector in the topology:
#   * It is the ONLY OTLP endpoint the Go services talk to. Services set
#     SHARPLINE_OTEL_ENDPOINT=otel-collector:4317 (frozen env var name).
#   * Traces are batched here and forwarded to Jaeger over OTLP.
#   * OTLP metrics (Go runtime / SDK-native instrumentation) are re-exposed on
#     :8889 for Prometheus to scrape.
#   * The collector's OWN internal telemetry is exposed on :8888.
#
# IMPORTANT — no double counting:
#   The frozen topology says every Go service serves GET /metrics on its own
#   port. That local Prometheus registry is the AUTHORITATIVE path for every
#   sharpline_* metric in the metric contract. Services must NOT also push those
#   same series over OTLP, or Prometheus will scrape each series twice (once
#   direct, once via :8889) with different job labels.
#
# Ports this container listens on (compose/Helm owner: please map/expose these
# on the internal network only — nothing published to the host except proxy):
#   4317  OTLP gRPC     (frozen)
#   4318  OTLP HTTP     (frozen)
#   8888  collector internal telemetry (Prometheus scrape)
#   8889  Prometheus exporter for OTLP-sourced metrics
#   13133 health_check  (compose healthcheck target)
#   1777  pprof
#   55679 zpages
#
# Validated with:
#   docker run --rm -v .../otel-collector.yaml:/etc/otel/config.yaml \
#     otel/opentelemetry-collector-contrib@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5 \
#     validate --config /etc/otel/config.yaml
#
# Component IDs below are the canonical names shipped by collector v0.158.0
# (`otelcol-contrib components`), e.g. `otlp_grpc` not `otlp`,
# `resource_detection` not `resourcedetection`.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /healthz
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  # The single ingress for every Go service's traces and SDK metrics.
  # W3C tracecontext + baggage propagation is a CLIENT-side concern: each Go
  # service must install
  #   otel.SetTextMapPropagator(propagation.NewCompositeTextMapPropagator(
  #     propagation.TraceContext{}, propagation.Baggage{}))
  # and must inject/extract on every hop, including the Kafka message headers
  # between ingest -> pricer -> stream. Without that the end-to-end trace
  # breaks at the bus and this collector cannot repair it.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Local/in-cluster traffic only; TLS terminates at the proxy.
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318

  # Collector self-telemetry is exported via service.telemetry.metrics.readers
  # (see bottom of this file) rather than scraped from here.

processors:
  # memory_limiter MUST be first in every pipeline (upstream requirement):
  # it applies backpressure to the receivers before the process is OOM-killed.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # CLAUDE.md §9 asks for the batch processor explicitly.
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Resource attributes.
  #
  # service.name is NOT set here on purpose. It is owned by the emitting
  # service's SDK (OTEL_SERVICE_NAME / resource.WithAttributes) and must be
  # exactly one of: api, ingest, pricer, stream, settle, migrate. Overwriting it
  # here would collapse the ingest -> pricer -> stream chain into one node in
  # Jaeger's service graph, which is precisely the thing §9 wants to see.
  #
  # `insert` only adds an attribute when it is absent, so a service that already
  # declares these keeps its own values.
  resource:
    attributes:
      - key: service.namespace
        value: sharpline
        action: insert
      - key: deployment.environment
        value: ${env:SHARPLINE_ENV}
        action: insert

  # Fills in host/container/OS attributes so a span can be traced back to the
  # node it ran on once this moves to Kubernetes.
  resource_detection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    timeout: 5s
    override: false

exporters:
  # Traces -> Jaeger. jaegertracing/all-in-one v1.76 accepts OTLP natively on
  # 4317/4318 (COLLECTOR_OTLP_ENABLED defaults to true since 1.35). The old
  # `jaeger` exporter was removed from the collector years ago; OTLP is the
  # only supported path.
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

  # Metrics -> Prometheus. This endpoint carries OTLP-sourced metrics only
  # (SDK/runtime instrumentation). Prometheus scrapes it as job
  # "otel-collector-otlp"; see prometheus.yml.
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: sharpline_otel
    send_timestamps: true
    metric_expiration: 5m
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true

  # Off by default. Flip verbosity to `detailed` in a debug session only —
  # at 10k WebSocket subscribers this will drown the log.
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource, batch]
      exporters: [otlp_grpc/jaeger]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource, batch]
      exporters: [debug]

  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
